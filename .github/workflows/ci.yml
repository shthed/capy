name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-test:
    name: Android Unit Tests & APK Build (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests & Assemble Debug APK
        run: ./gradlew app:testDebugUnitTest app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  web-verify:
    name: Web Build & Typecheck (web/)
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  web1-verify:
    name: Web & Web1 Playwright Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web1/package-lock.json

      - name: Build Updated Web (web/)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Legacy Web (web1/) dependencies
        working-directory: web1
        run: npm ci

      - name: Provision Playwright browsers
        working-directory: web1
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Suite on web1/ and built web/dist/
        working-directory: web1
        run: |
          rm -rf web-dist-test
          cp -r ../web/dist web-dist-test
          npm test --silent
          rm -rf web-dist-test
