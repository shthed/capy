name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-test:
    name: Android Unit Tests (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: ./gradlew app:testDebugUnitTest

  web-verify:
    name: Web Build & Typecheck (web/)
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  web1-verify:
    name: Legacy Web Smoke Tests (web1/)
    defaults:
      run:
        working-directory: web1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Provision Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Web1 Smoke Suite
        run: npm test --silent
