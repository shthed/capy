name: Regenerate Pre-Baked Max-Settings Puzzles

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - 'web/public/assets/**'
      - '!web/public/assets/**/*.capy'
      - '!web/public/assets/presets/**'
      - '!web/public/assets/icon-*.png'
      - '!web/public/assets/apple-touch-icon.png'
      - 'web/scripts/generate-sample-saves.mjs'
      - 'web/src/engine/**'
      - 'web/src/services/CapyCodec.ts'
      - 'web/src/services/DailyPuzzleService.ts'
      - 'web/src/services/PuzzleWorkerService.ts'
      - 'web/src/services/StorageService.ts'
      - 'web/src/types/index.ts'
      - '.github/workflows/regenerate-puzzles.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: regenerate-puzzles-beta
  cancel-in-progress: false

jobs:
  regenerate-puzzles:
    if: github.repository == 'shthed/capy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout beta
        uses: actions/checkout@v7
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies and Playwright Chromium
        working-directory: web
        run: |
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" != "true" ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Regenerate Max-settings sample and daily .capy archives
        working-directory: web
        run: npm run generate:samples

      - name: Verify sanity, lint, build, and unit suite
        working-directory: web
        run: npm run test:sanity && npm run lint && npm run build && npm run test:unit

      - name: Check for changed .capy assets
        id: diff_check
        run: |
          if git diff --quiet web/public/assets/sample_saves.capy web/public/assets/daily_saves.capy; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push regenerated .capy archives as github-actions[bot]
        id: push_puzzles
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/public/assets/sample_saves.capy web/public/assets/daily_saves.capy
          git commit -m "Regenerate Max-settings sample and daily .capy puzzles"

          git fetch origin +refs/heads/beta:refs/remotes/origin/beta
          git rebase origin/beta
          if git push origin HEAD:refs/heads/beta 2>push_err.log; then
            echo "Pushed regenerated .capy archives directly to beta."
            echo "direct_pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Direct push to protected beta declined; pushing bot branch chore/regenerate-puzzles instead."
          git push --force-with-lease origin HEAD:refs/heads/chore/regenerate-puzzles
          echo "direct_pushed=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch beta deploy or open bot PR for regenerated .capy archives
        if: steps.diff_check.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          DIRECT_PUSHED: ${{ steps.push_puzzles.outputs.direct_pushed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (process.env.DIRECT_PUSHED === 'true') {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'deploy-branch.yml',
                ref: 'main',
                inputs: { target_branch: 'beta' },
              });
              return;
            }
            const headBranch = 'chore/regenerate-puzzles';
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: 'beta',
              state: 'open',
              per_page: 5,
            });
            const title = 'chore: regenerate sample and daily .capy puzzles';
            const body = [
              '## Summary',
              '',
              'Updates the pre-generated built-in gallery and daily puzzle `.capy` archives after engine or asset changes so players launch with fresh, verified Max-Detail puzzles.',
              '',
              '### PR Readiness Score: 100%',
              '',
              '<details>',
              '<summary>PR Readiness Checklist</summary>',
              '',
              '- **100%** — **Pre-Baked Archives Regenerated**: `npm run generate:samples` completed cleanly in CI.',
              '- **100%** — **Automated Verification**: `npm run test:sanity`, `npm run lint`, `npm run build`, and `npm run test:unit` passed on the regenerated archives.',
              '',
              '</details>',
              '',
              'Automated `.capy` puzzle regeneration passed all local build and unit gates.',
            ].join('\n');
            if (existing.length > 0) {
              await github.rest.pulls.update({ owner, repo, pull_number: existing[0].number, title, body });
            } else {
              await github.rest.pulls.create({ owner, repo, head: headBranch, base: 'beta', title, body, draft: true });
            }
