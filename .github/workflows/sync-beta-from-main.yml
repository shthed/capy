name: Sync beta from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sync-beta-from-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync beta with main
    if: github.repository == 'shthed/capy'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CAPY_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge origin/main into sync/beta-from-main
        id: sync_git
        env:
          HAS_BOT_TOKEN: ${{ secrets.CAPY_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta

          if ! git rev-parse --verify --quiet origin/beta >/dev/null; then
            echo "origin/beta branch does not exist; skipping sync."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor origin/main origin/beta; then
            echo "origin/main is already an ancestor of origin/beta; nothing to sync."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Beta Ancestry Sync: Up to Date"
              echo "- \`origin/main\` (\`$(git rev-parse --short origin/main)\`) is already an ancestor of \`origin/beta\` (\`$(git rev-parse --short origin/beta)\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MAIN_SHA=$(git rev-parse --short origin/main)
          BETA_SHA=$(git rev-parse --short origin/beta)

          git checkout -B sync/beta-from-main origin/beta
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-ff origin/main -m "Sync beta with main (${MAIN_SHA})"; then
            git merge --abort || true
            echo "merge_conflict=true" >> "$GITHUB_OUTPUT"
            echo "direct_pushed=false" >> "$GITHUB_OUTPUT"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
            echo "beta_sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"
            {
              echo "### Beta Ancestry Sync Conflict"
              echo "- Merging \`origin/main\` (\`${MAIN_SHA}\`) into \`origin/beta\` (\`${BETA_SHA}\`) produced merge conflicts."
              echo "- Resolve manually in an isolated worktree:"
              echo '```bash'
              echo 'git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta'
              echo 'git checkout -B sync/beta-from-main origin/beta'
              echo 'git merge --no-ff origin/main'
              echo '# resolve conflicts, commit, push, and merge PR with --merge (never squash)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          WORKFLOW_DIFFS=$(git diff --name-only origin/beta..HEAD -- .github/workflows/ || true)
          if [ -n "${WORKFLOW_DIFFS}" ] && [ "${HAS_BOT_TOKEN}" != "true" ]; then
            {
              echo "### Beta Ancestry Sync Blocked: Workflow Diff Requires \`CAPY_BOT_TOKEN\` or Local Push"
              echo "- Merging \`origin/main\` (\`${MAIN_SHA}\`) into \`origin/beta\` (\`${BETA_SHA}\`) touches workflow files:"
              echo '```text'
              echo "${WORKFLOW_DIFFS}"
              echo '```'
              echo "- \`secrets.CAPY_BOT_TOKEN\` is unset and GitHub App \`GITHUB_TOKEN\` lacks \`workflows: write\` permission to push \`.github/workflows/*\` changes."
              echo "- Sync manually from an isolated worktree (with \`workflow\` OAuth scope) and merge via \`--merge\`:"
              echo '```bash'
              echo 'git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta'
              echo 'git checkout -B sync/beta-from-main origin/beta'
              echo 'git merge --no-ff origin/main'
              echo 'git push -u origin sync/beta-from-main'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if git push origin HEAD:refs/heads/beta 2>push_err.log; then
            echo "Direct push of origin/main (${MAIN_SHA}) into origin/beta succeeded."
            echo "direct_pushed=true" >> "$GITHUB_OUTPUT"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "merge_conflict=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
            echo "beta_sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUSH_ERR=$(cat push_err.log || true)
          echo "::warning::Direct push to origin/beta was rejected (beta ruleset 27162684 currently blocks direct pushes with bypass_actors: []): ${PUSH_ERR}. Falling back to sync/beta-from-main PR."

          REMOTE_SYNC_SHA=$(git ls-remote --heads origin sync/beta-from-main | awk '{print $1}')
          if [ -n "${REMOTE_SYNC_SHA}" ]; then
            git fetch origin +refs/heads/sync/beta-from-main:refs/remotes/origin/sync/beta-from-main
            if git merge-base --is-ancestor origin/main origin/sync/beta-from-main && \
               git merge-base --is-ancestor origin/beta origin/sync/beta-from-main && \
               git diff --quiet origin/sync/beta-from-main HEAD; then
              echo "Remote sync/beta-from-main already matches merged ancestry and tree; skipping push."
            else
              git push --force-with-lease="refs/heads/sync/beta-from-main:${REMOTE_SYNC_SHA}" origin HEAD:refs/heads/sync/beta-from-main
            fi
          else
            git push --force-with-lease="refs/heads/sync/beta-from-main:" origin HEAD:refs/heads/sync/beta-from-main
          fi

          echo "direct_pushed=false" >> "$GITHUB_OUTPUT"
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          echo "merge_conflict=false" >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "beta_sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"

      - name: Finalize direct sync, fallback PR, or conflict issue
        if: steps.sync_git.outputs.direct_pushed == 'true' || steps.sync_git.outputs.needs_sync == 'true' || steps.sync_git.outputs.merge_conflict == 'true'
        uses: actions/github-script@v9
        env:
          HAS_BOT_TOKEN: ${{ secrets.CAPY_BOT_TOKEN != '' }}
          DIRECT_PUSHED: ${{ steps.sync_git.outputs.direct_pushed }}
          NEEDS_SYNC: ${{ steps.sync_git.outputs.needs_sync }}
          MERGE_CONFLICT: ${{ steps.sync_git.outputs.merge_conflict }}
          MAIN_SHA: ${{ steps.sync_git.outputs.main_sha }}
          BETA_SHA: ${{ steps.sync_git.outputs.beta_sha }}
        with:
          github-token: ${{ secrets.CAPY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const hasPatToken = process.env.HAS_BOT_TOKEN === 'true';
            const directPushed = process.env.DIRECT_PUSHED === 'true';
            const mergeConflict = process.env.MERGE_CONFLICT === 'true';
            const mainSha = process.env.MAIN_SHA || '';
            const betaSha = process.env.BETA_SHA || '';
            const headBranch = 'sync/beta-from-main';
            const baseBranch = 'beta';

            if (mergeConflict) {
              const conflictTitle = `Sync beta with main conflict (${mainSha})`;
              const conflictBody = [
                '## Summary',
                '',
                `Automatic back-merge of \`main\` (\`${mainSha}\`) into \`beta\` (\`${betaSha}\`) hit merge conflicts and was aborted.`,
                '',
                '### Resolution Steps',
                '',
                '```bash',
                'git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta',
                'git checkout -B sync/beta-from-main origin/beta',
                'git merge --no-ff origin/main',
                '# resolve conflicts, commit, push, and merge PR with --merge (never squash)',
                '```',
              ].join('\n');

              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'ci',
                per_page: 25,
              });
              const existingIssue = openIssues.find(
                (iss) => !iss.pull_request && iss.title.startsWith('Sync beta with main conflict')
              );
              if (existingIssue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  title: conflictTitle,
                  body: conflictBody,
                });
                core.info(`Updated conflict issue #${existingIssue.number}: ${existingIssue.html_url}`);
              } else {
                const { data: createdIssue } = await github.rest.issues.create({
                  owner,
                  repo,
                  title: conflictTitle,
                  body: conflictBody,
                  labels: ['ci'],
                });
                core.info(`Created conflict issue #${createdIssue.number}: ${createdIssue.html_url}`);
              }
              core.setFailed(`Merge conflict syncing origin/main (${mainSha}) into origin/beta (${betaSha}).`);
              return;
            }

            if (directPushed) {
              const { data: openPrs } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${headBranch}`,
                base: baseBranch,
                state: 'open',
                per_page: 10,
              });
              for (const stalePr of openPrs) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: stalePr.number,
                  body: `\`beta\` was synced directly with \`main\` (\`${mainSha}\`); closing this obsolete sync PR.`,
                });
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: stalePr.number,
                  state: 'closed',
                });
                core.info(`Closed stale sync PR #${stalePr.number}`);
              }

              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'ci',
                per_page: 25,
              });
              for (const iss of openIssues) {
                if (!iss.pull_request && iss.title.startsWith('Sync beta with main conflict')) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: iss.number,
                    state: 'closed',
                  });
                }
              }

              if (!hasPatToken) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'deploy-branch.yml',
                    ref: 'main',
                    inputs: { target_branch: 'beta' },
                  });
                  core.info('Dispatched deploy-branch.yml for target_branch=beta.');
                } catch (err) {
                  core.warning(`Failed to dispatch deploy-branch.yml for beta: ${err.message}`);
                }
              }

              await core.summary
                .addRaw(
                  [
                    '### Beta Direct Sync Complete',
                    `- **Main HEAD**: \`${mainSha}\``,
                    `- **Previous Beta**: \`${betaSha}\``,
                    `- **Stale Sync PRs Closed**: \`${openPrs.length}\``,
                    `- **Token Mode**: \`${hasPatToken ? 'CAPY_BOT_TOKEN' : 'GITHUB_TOKEN'}\``,
                  ].join('\n') + '\n'
                )
                .write();
              return;
            }

            const title = `Sync beta with main (${mainSha})`;

            const body = [
              '## Summary',
              '',
              'Keeps the Beta testing channel up to date with the latest approved changes from the main release branch so upcoming test builds include recent fixes without merge conflicts. Once fast checks and review verification pass, this sync PR is automatically merged with a merge commit (never squashed).',
              '',
              '### Sync Details',
              '',
              `- **Main HEAD**: \`${mainSha}\``,
              `- **Beta Base**: \`${betaSha}\``,
              '- **Merge Policy**: **Auto-merges strictly via merge commit (`gh pr merge <PR_NUM> --merge`)** once `Build & Test` (fast sanity check when `HEAD` tree matches `origin/main`) and `capy/review-gate` (auto-passed & auto-merged by `pr-review-gate.yml` once `origin/main` ancestry + zero unreviewed commits/diffs are verified with zero holds) pass. **Humans: NEVER click "Squash and merge" or "Rebase and merge" on sync PRs**, or `origin/main` ancestry will not be preserved on `beta`.',
              '- **Token Mode**: ' +
                (hasPatToken
                  ? 'Created/updated with `CAPY_BOT_TOKEN` (`draft: false`; `pull_request` workflows trigger immediately and `.github/workflows/*` diffs can be pushed cleanly).'
                  : 'Created/updated with `GITHUB_TOKEN` (new PRs start with `draft: true`; automatic `opened`/`synchronize` evaluation of `pr-review-gate.yml` and `deploy-branch.yml` requires `CAPY_BOT_TOKEN`, and `GITHUB_TOKEN` lacks `workflows: write` if `origin/main` includes `.github/workflows/*` changes not yet on `beta`).'),
              ...(hasPatToken
                ? []
                : [
                    '',
                    '> [!NOTE]',
                    '> Created/updated with `GITHUB_TOKEN` (`draft: true` on new PR creation). Automatic `synchronize`/`opened` evaluation of `pr-review-gate.yml` and `deploy-branch.yml` **requires `CAPY_BOT_TOKEN`** (pushes made with `GITHUB_TOKEN` trigger `action_required` / zero-job skips from GitHub Actions). With `CAPY_BOT_TOKEN` unset, run non-bot `gh pr ready <PR_NUM>` once ready (or manually dispatch `gh workflow run pr-review-gate.yml -f pr_number=<PR_NUM>` and `gh workflow run deploy-branch.yml -f target_branch=sync/beta-from-main`) to evaluate `capy/review-gate` and CI.',
                  ]),
            ].join('\n');

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: 'open',
              per_page: 10,
            });

            let pr = null;
            let action = '';
            if (openPrs.length > 0) {
              const existing = openPrs[0];
              const finalBody = body.replaceAll('<PR_NUM>', String(existing.number));
              const { data: updated } = await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing.number,
                title,
                body: finalBody,
              });
              pr = updated;
              action = 'updated';
              const existingLabels = new Set((existing.labels || []).map((l) => l.name));
              if (!existingLabels.has('ci')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ['ci'],
                });
              }
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head: headBranch,
                base: baseBranch,
                title,
                body,
                draft: !hasPatToken,
              });
              pr = created;
              action = 'created';
              const finalBody = body.replaceAll('<PR_NUM>', String(pr.number));
              if (finalBody !== body) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  body: finalBody,
                });
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ['ci'],
              });
            }

            if (!pr.draft && typeof github.graphql === 'function' && pr.node_id) {
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pr.node_id }
                );
              } catch (err) {
                core.warning(`Auto-merge enablement warning for sync PR #${pr.number}: ${err.message}`);
              }
            }

            core.info(`Sync PR #${pr.number} (${action}): ${pr.html_url}`);
            await core.summary
              .addRaw(
                [
                  `### Beta Ancestry Sync PR #${pr.number} (${action})`,
                  `- **URL**: ${pr.html_url}`,
                  `- **Merge Command**: \`gh pr merge ${pr.number} --merge\``,
                  `- **Draft**: \`${Boolean(pr.draft)}\``,
                  `- **Token Mode**: \`${hasPatToken ? 'CAPY_BOT_TOKEN' : 'GITHUB_TOKEN'}\``,
                ].join('\n') + '\n'
              )
              .write();
