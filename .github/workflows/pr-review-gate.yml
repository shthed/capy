name: Dual AI & Owner PR Review Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: pr-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: Dual AI & Owner Review Gate
    if: github.repository == 'shthed/capy' && github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]' && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Dual AI + Project Owner Approval State
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!prNumber) {
              core.info('No pull request number associated with event; skipping.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state}; skipping review gate.`);
              return;
            }

            const headSha = pr.head.sha;
            const isDraft = Boolean(pr.draft);
            const baseRef = (pr.base?.ref || 'main').trim();
            const isBetaTarget = baseRef === 'beta';
            const ownerLogin = owner.toLowerCase();
            const ALLOWED_OWNER_LOGINS = new Set([ownerLogin, 'capyboop']);
            const prAuthorLogin = (pr.user?.login || '').toLowerCase();
            const isDependabotPr = prAuthorLogin === 'dependabot[bot]';
            const isReadOnlyDependabotEvent =
              isDependabotPr && context.eventName === 'pull_request';

            const { data: headCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: headSha,
            });
            const commitMs =
              Date.parse(headCommit.commit.committer?.date || headCommit.commit.author?.date || '') || 0;

            const issueEvents = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            let latestForcePushMs = 0;
            for (const ev of issueEvents) {
              if (ev.event === 'head_ref_force_pushed' && ev.created_at) {
                const ts = Date.parse(ev.created_at) || 0;
                if (ts > latestForcePushMs) latestForcePushMs = ts;
              }
            }
            const latestPushMs = Math.max(commitMs, latestForcePushMs);

            const activeLabels = new Set((pr.labels || []).map((l) => l.name));

            async function safeRemoveLabel(labelName) {
              if (!activeLabels.has(labelName)) return;
              activeLabels.delete(labelName);
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: labelName,
                });
              } catch (err) {
                if (err.status !== 404) {
                  core.warning(`Failed to remove label ${labelName}: ${err.message}`);
                }
              }
            }

            const isSynchronize =
              context.eventName === 'pull_request' &&
              context.payload.action === 'synchronize';
            const isNewPushOrDraft =
              isDraft ||
              isSynchronize ||
              (context.eventName === 'pull_request' &&
                context.payload.action === 'converted_to_draft');

            if (isNewPushOrDraft) {
              await safeRemoveLabel('review:ai-approved');
              await safeRemoveLabel('review:owner-approved');
            }
            if (isSynchronize) {
              await safeRemoveLabel('review:changes-requested');
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // 1. Evaluate Independent AI Agent Gate for exact headSha
            const aiMarkerRegex = new RegExp(
              `<!--\\s*capy-review:\\s*actor=ai-agent\\s+verdict=(APPROVED|CHANGES_REQUESTED)\\s+sha=${headSha}\\s+score=([0-9]+(?:\\.[0-9]+)?)%?[^>]*-->`,
              'i'
            );
            const ALLOWED_AI_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isTrustedAiReviewer = (item) => {
              const login = (item?.user?.login || '').toLowerCase();
              const assoc = String(item?.author_association || '').toUpperCase();
              return (
                ALLOWED_OWNER_LOGINS.has(login) ||
                login === 'github-actions[bot]' ||
                ALLOWED_AI_ASSOCIATIONS.has(assoc)
              );
            };
            const isActiveTrustedAiReview = (r) => {
              const reviewState = String(r?.state || '').toUpperCase();
              return (
                reviewState !== 'DISMISSED' &&
                reviewState !== 'PENDING' &&
                isTrustedAiReviewer(r)
              );
            };
            let latestAiSignal = null;
            let earliestExactHeadAiMs = 0;
            const allBodies = [
              ...reviews.filter(isActiveTrustedAiReview).map((r) => ({
                body: r.body || '',
                ts: Date.parse(r.submitted_at || '') || 0,
              })),
              ...comments.filter(isTrustedAiReviewer).map((c) => ({
                body: c.body || '',
                ts: Date.parse(c.updated_at || c.created_at || '') || 0,
              })),
            ].sort((a, b) => a.ts - b.ts);

            for (const item of allBodies) {
              const m = aiMarkerRegex.exec(item.body);
              if (m) {
                if (item.ts >= latestForcePushMs && item.ts > 0) {
                  if (earliestExactHeadAiMs === 0 || item.ts < earliestExactHeadAiMs) {
                    earliestExactHeadAiMs = item.ts;
                  }
                }
                latestAiSignal = {
                  verdict: m[1].toUpperCase(),
                  score: Number(m[2]),
                };
              }
            }

            const hasValidAiMarker =
              latestAiSignal !== null &&
              latestAiSignal.verdict === 'APPROVED' &&
              Number.isFinite(latestAiSignal.score) &&
              latestAiSignal.score >= 95;

            if (activeLabels.has('review:ai-approved') && !hasValidAiMarker) {
              await safeRemoveLabel('review:ai-approved');
            }

            const aiApproved = !isDraft && activeLabels.has('review:ai-approved') && hasValidAiMarker;
            const aiChangesRequested =
              latestAiSignal !== null && latestAiSignal.verdict === 'CHANGES_REQUESTED';

            // 2. Evaluate Separate Post-Push Human Project Owner Gate
            const nativeHeadApprovals = [];
            const rejectionCandidates = [];
            let earliestExactHeadReviewMs = 0;

            if (activeLabels.has('review:changes-requested')) {
              rejectionCandidates.push({
                ts: Number.MAX_SAFE_INTEGER,
                id: Number.MAX_SAFE_INTEGER,
                source: 'label',
                exactHead: true,
              });
            }

            const isHumanOwnerBody = (body) =>
              !body.includes('<!-- capy-review:') && !body.includes('<!-- capy-pages-preview -->');

            for (const r of reviews) {
              if (!ALLOWED_OWNER_LOGINS.has(r.user?.login?.toLowerCase())) continue;
              if (r.state === 'PENDING') continue;
              const body = (r.body || '').trim();
              if (!isHumanOwnerBody(body)) continue;
              const ts = Date.parse(r.submitted_at || '') || 0;
              const id = Number(r.id) || 0;
              const isExactHead = r.commit_id === headSha;

              if (isExactHead && ts >= latestForcePushMs && ts > 0) {
                if (earliestExactHeadReviewMs === 0 || ts < earliestExactHeadReviewMs) {
                  earliestExactHeadReviewMs = ts;
                }
              }
              if (r.state === 'DISMISSED') continue;

              const isRejectionBody = /^(?:CHANGES\s+REQUESTED|HOLD|DO\s+NOT\s+MERGE)\b/i.test(body);
              const isExactHeadNativeApproval =
                r.state === 'APPROVED' && isExactHead && !isRejectionBody;
              const isRejection = r.state === 'CHANGES_REQUESTED' || isRejectionBody;

              if (isExactHeadNativeApproval) {
                if (ts >= latestForcePushMs) {
                  nativeHeadApprovals.push({ ts, id, source: 'review' });
                }
              } else if (isRejection) {
                if (ts >= latestForcePushMs) {
                  rejectionCandidates.push({ ts, id, source: 'review', exactHead: isExactHead });
                }
              }
            }

            for (const c of comments) {
              if (!ALLOWED_OWNER_LOGINS.has(c.user?.login?.toLowerCase())) continue;
              const body = (c.body || '').trim();
              if (!isHumanOwnerBody(body)) continue;
              const ts = Date.parse(c.updated_at || c.created_at || '') || 0;
              const id = Number(c.id) || 0;

              if (/^(?:CHANGES\s+REQUESTED|HOLD|DO\s+NOT\s+MERGE)\b/i.test(body)) {
                if (ts >= latestForcePushMs) {
                  rejectionCandidates.push({ ts, id, source: 'comment', exactHead: false });
                }
              }
            }

            const maxSignalTs = (signals) =>
              signals.reduce((maxTs, s) => (s.ts > maxTs ? s.ts : maxTs), 0);

            const effectiveOwnerApprovals = nativeHeadApprovals;
            const effectiveOwnerApprovalMs = maxSignalTs(effectiveOwnerApprovals);

            const skewAnchorCandidates = [
              effectiveOwnerApprovalMs,
              earliestExactHeadReviewMs,
              earliestExactHeadAiMs,
            ].filter((ts) => ts > 0);
            const skewAnchorMs =
              skewAnchorCandidates.length > 0 ? Math.min(...skewAnchorCandidates) : 0;
            const rejectionFloorMs = Math.max(
              latestForcePushMs,
              Math.min(latestPushMs, skewAnchorMs || latestPushMs)
            );

            const activeRejections = rejectionCandidates.filter((rej) =>
              rej.exactHead ? rej.ts >= latestForcePushMs : rej.ts >= rejectionFloorMs
            );

            const compareReviewOrder = (a, b) => (a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]);
            const isApprovalStrictlyNewerThanRejection = (approval, rejection) => {
              if (!approval || !rejection) return false;
              if (approval.ts !== rejection.ts) return approval.ts > rejection.ts;
              if (
                approval.source === rejection.source &&
                approval.id > 0 &&
                rejection.id > 0
              ) {
                return compareReviewOrder([approval.ts, approval.id], [rejection.ts, rejection.id]) > 0;
              }
              return false;
            };

            const hasActiveOwnerRejection = activeRejections.some(
              (rej) =>
                !effectiveOwnerApprovals.some((app) =>
                  isApprovalStrictlyNewerThanRejection(app, rej)
                )
            );
            const changesRequested = aiChangesRequested || hasActiveOwnerRejection;
            const hasFreshNativeHeadApproval = nativeHeadApprovals.some((natApp) =>
              activeRejections.every((rej) =>
                isApprovalStrictlyNewerThanRejection(natApp, rej)
              )
            );
            const ownerApproved = !isDraft && !changesRequested && hasFreshNativeHeadApproval;
            const dualApproved = !isDraft && aiApproved && ownerApproved && !changesRequested;
            const betaApproved = isBetaTarget && !isDraft && aiApproved && !changesRequested;

            // 3. Dismiss any legacy github-actions[bot] formal PR approvals
            // Bot review rubber-stamping is removed; --base beta passes on AI review (>=95%)
            // without Owner approval, and --base main requires native GitHub APPROVED on HEAD.
            const botReviews = reviews.filter(
              (r) => r.user?.login === 'github-actions[bot]' && r.state === 'APPROVED'
            );
            if (!isReadOnlyDependabotEvent) {
              for (const br of botReviews) {
                try {
                  await github.rest.pulls.dismissReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    review_id: br.id,
                    message:
                      'Bot review rubber-stamping is disabled; native GitHub approval on HEAD is required for main.',
                  });
                } catch (err) {
                  core.warning(`Failed to dismiss bot review ${br.id}: ${err.message}`);
                }
              }
            }

            // 4. Post Commit Status capy/review-gate on headSha (<= 140 chars)
            let state = 'pending';
            let description = 'Awaiting AI review (review:ai-approved) and Owner sign-off';
            if (changesRequested) {
              state = 'failure';
              description = 'Changes requested or hold active; address feedback before merge';
            } else if (isDraft) {
              state = 'pending';
              description = 'Draft PR: complete work, pass AI review, and mark ready';
            } else if (isBetaTarget) {
              if (betaApproved) {
                state = 'success';
                description = 'Beta gate passed: AI review (>=95%) verified; no holds';
              } else {
                state = 'pending';
                description = 'Beta gate: awaiting AI review (review:ai-approved) on HEAD';
              }
            } else if (dualApproved) {
              state = 'success';
              description = 'Dual-approved: AI review (>=95%) + Owner sign-off verified';
            } else if (aiApproved && !ownerApproved) {
              state = 'pending';
              description = 'AI review passed; awaiting Project Owner sign-off';
            } else if (!aiApproved && ownerApproved) {
              state = 'pending';
              description = 'Owner approved; awaiting AI review marker for current HEAD';
            }

            const clippedDesc = description.slice(0, 140);
            const { data: existingStatuses } = await github.rest.repos.listCommitStatusesForRef({
              owner,
              repo,
              ref: headSha,
              per_page: 30,
            });
            const latestGateStatus = existingStatuses.find(
              (s) => s.context === 'capy/review-gate'
            );
            if (
              !latestGateStatus ||
              latestGateStatus.state !== state ||
              latestGateStatus.description !== clippedDesc
            ) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  context: 'capy/review-gate',
                  state,
                  description: clippedDesc,
                });
              } catch (err) {
                if (isReadOnlyDependabotEvent && err.status === 403) {
                  core.warning(
                    `Read-only GITHUB_TOKEN on Dependabot ${context.eventName} event prevented updating capy/review-gate status: ${err.message}`
                  );
                } else {
                  throw err;
                }
              }
            }
