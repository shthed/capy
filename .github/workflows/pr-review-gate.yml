name: Dual AI & Owner PR Review Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to re-evaluate'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: pr-review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: Dual AI & Owner Review Gate
    needs: [ai-review]
    if: >-
      always() &&
      github.repository == 'shthed/capy' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.actor != 'dependabot[bot]' &&
          (github.actor != 'github-actions[bot]' ||
            (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review","converted_to_draft"]'), github.event.action)) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '<!-- capy-review:')) ||
            (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '<!-- capy-review:') && !contains(github.event.comment.body || '', '<!-- capy-pages-preview -->'))))) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && !contains(github.event.comment.body || '', '<!-- capy-gate-status -->'))) &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Strict 100% AI Approval & Auto-Merge State
        uses: actions/github-script@v9
        env:
          ACTIONS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.CAPY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber =
              context.payload.pull_request?.number ||
              context.payload.issue?.number ||
              (Number(context.payload.inputs?.pr_number || 0) || null);
            if (!prNumber) {
              core.info('No pull request number associated with event; skipping.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state}; skipping review gate.`);
              return;
            }

            const headSha = pr.head.sha;
            const isDraft = Boolean(pr.draft);
            const baseRef = (pr.base?.ref || 'main').trim();
            const isBetaTarget = baseRef === 'beta';
            const ownerLogin = owner.toLowerCase();
            const ALLOWED_OWNER_LOGINS = new Set([ownerLogin, 'capyboop']);
            const prAuthorLogin = (pr.user?.login || '').toLowerCase();
            const isDependabotPr = prAuthorLogin === 'dependabot[bot]';
            const isReadOnlyDependabotEvent =
              isDependabotPr && context.eventName === 'pull_request';

            const { data: headCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: headSha,
            });
            const nowMs = Date.now();
            const rawCommitMs =
              Date.parse(headCommit.commit.committer?.date || headCommit.commit.author?.date || '') || 0;

            const issueEvents = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            let latestForcePushMs = 0;
            for (const ev of issueEvents) {
              if (ev.event === 'head_ref_force_pushed' && ev.created_at) {
                const ts = Date.parse(ev.created_at) || 0;
                if (ts > latestForcePushMs) latestForcePushMs = ts;
              }
            }

            const existingStatuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              }
            );
            const prCreatedMs = Date.parse(pr.created_at || '') || 0;
            let earliestHeadStatusMs = 0;
            for (const s of existingStatuses || []) {
              if (s?.context !== 'capy/review-gate' || !s?.created_at) continue;
              const ts = Date.parse(s.created_at) || 0;
              if (ts >= Math.max(latestForcePushMs, prCreatedMs) && ts > 0 && ts <= nowMs + 60_000) {
                if (earliestHeadStatusMs === 0 || ts < earliestHeadStatusMs) {
                  earliestHeadStatusMs = ts;
                }
              }
            }

            const effectiveCommitMs =
              rawCommitMs > nowMs ||
              (earliestHeadStatusMs > 0 && rawCommitMs > earliestHeadStatusMs) ||
              (latestForcePushMs > 0 && rawCommitMs > latestForcePushMs)
                ? 0
                : rawCommitMs;
            const commitMs = effectiveCommitMs;
            const latestPushMs = Math.max(effectiveCommitMs, latestForcePushMs);

            const activeLabels = new Set((pr.labels || []).map((l) => l.name));
            const hadAiApprovedLabel = activeLabels.has('review:ai-approved');

            async function safeRemoveLabel(labelName) {
              if (!activeLabels.has(labelName)) return;
              activeLabels.delete(labelName);
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: labelName,
                });
              } catch (err) {
                if (err.status !== 404) {
                  core.warning(`Failed to remove label ${labelName}: ${err.message}`);
                }
              }
            }

            const isSynchronize =
              context.eventName === 'pull_request' &&
              context.payload.action === 'synchronize';
            const isNewPushOrDraft =
              isDraft ||
              isSynchronize ||
              (context.eventName === 'pull_request' &&
                context.payload.action === 'converted_to_draft');

            if (isNewPushOrDraft) {
              await safeRemoveLabel('review:ai-approved');
              await safeRemoveLabel('review:owner-approved');
            }
            if (isSynchronize) {
              await safeRemoveLabel('review:changes-requested');
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // 1. Evaluate Strict Independent AI Agent 100% Gate for exact headSha
            const aiMarkerRegex = new RegExp(
              `<!--\\s*capy-review:\\s*actor=ai-agent\\s+verdict=(APPROVED|CHANGES_REQUESTED)\\s+sha=${headSha}\\s+score=([0-9]+(?:\\.[0-9]+)?)%?[^>]*-->`,
              'i'
            );
            const ALLOWED_AI_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isTrustedAiReviewer = (item) => {
              const login = (item?.user?.login || '').toLowerCase();
              const assoc = String(item?.author_association || '').toUpperCase();
              return (
                ALLOWED_OWNER_LOGINS.has(login) ||
                login === 'github-actions[bot]' ||
                ALLOWED_AI_ASSOCIATIONS.has(assoc)
              );
            };
            const isActiveTrustedAiReview = (r) => {
              const reviewState = String(r?.state || '').toUpperCase();
              return (
                reviewState !== 'DISMISSED' &&
                reviewState !== 'PENDING' &&
                isTrustedAiReviewer(r)
              );
            };
            let latestAiSignal = null;
            let earliestExactHeadAiMs = 0;
            const allBodies = [
              ...reviews.filter(isActiveTrustedAiReview).map((r) => ({
                body: r.body || '',
                ts: Date.parse(r.submitted_at || '') || 0,
              })),
              ...comments.filter(isTrustedAiReviewer).map((c) => ({
                body: c.body || '',
                ts: Date.parse(c.updated_at || c.created_at || '') || 0,
              })),
            ].sort((a, b) => a.ts - b.ts);

            for (const item of allBodies) {
              const m = aiMarkerRegex.exec(item.body);
              if (m) {
                if (item.ts >= latestForcePushMs && item.ts > 0) {
                  if (earliestExactHeadAiMs === 0 || item.ts < earliestExactHeadAiMs) {
                    earliestExactHeadAiMs = item.ts;
                  }
                }
                latestAiSignal = {
                  verdict: m[1].toUpperCase(),
                  score: Number(m[2]),
                  body: item.body,
                };
              }
            }

            const hasChecklistSub100OrUnchecked = (text) => {
              if (!text) return false;
              if (/^\s*[-*]\s+\[\s\]/m.test(text)) return true;
              const scoreMatches = text.matchAll(/###\s*PR Readiness Score:\s*([0-9]+(?:\.[0-9]+)?)%/gi);
              for (const m of scoreMatches) {
                const val = Number(m[1]);
                if (!Number.isFinite(val) || val !== 100) return true;
              }
              const itemMatches = text.matchAll(/^\s*[-*]\s+\*\*([0-9]+(?:\.[0-9]+)?)%\*\*/gm);
              for (const m of itemMatches) {
                const val = Number(m[1]);
                if (!Number.isFinite(val) || val !== 100) return true;
              }
              return false;
            };

            const isStrictPrBodyValid = (() => {
              if (typeof pr.body !== 'string') return false;
              if (isDependabotPr) return !hasChecklistSub100OrUnchecked(pr.body);
              if (pr.head?.ref === 'sync/beta-from-main') return true;
              const trimmed = pr.body.trim();
              if (!trimmed) return false;
              if (!/^##\s+Summary\b/im.test(trimmed)) return false;
              if (!/###\s*PR Readiness Score:\s*100%/i.test(trimmed)) return false;
              if (hasChecklistSub100OrUnchecked(trimmed)) return false;
              return true;
            })();

            const isStrictAiBodyValid =
              latestAiSignal !== null && !hasChecklistSub100OrUnchecked(latestAiSignal.body);

            const hasValidAiMarker =
              latestAiSignal !== null &&
              latestAiSignal.verdict === 'APPROVED' &&
              Number.isFinite(latestAiSignal.score) &&
              latestAiSignal.score >= 100 &&
              latestAiSignal.score === 100 &&
              isStrictAiBodyValid &&
              isStrictPrBodyValid;

            if (activeLabels.has('review:ai-approved') && !hasValidAiMarker) {
              await safeRemoveLabel('review:ai-approved');
            }

            const aiApproved = !isDraft && activeLabels.has('review:ai-approved') && hasValidAiMarker;
            const aiChangesRequested =
              latestAiSignal !== null && latestAiSignal.verdict === 'CHANGES_REQUESTED';

            // 2. Evaluate Post-Push Human Project Owner Holds / Overrides
            const nativeHeadApprovals = [];
            const rejectionCandidates = [];
            let earliestExactHeadReviewMs = 0;

            if (activeLabels.has('review:changes-requested')) {
              rejectionCandidates.push({
                ts: Number.MAX_SAFE_INTEGER,
                id: Number.MAX_SAFE_INTEGER,
                source: 'label',
                exactHead: true,
              });
            }

            const isHumanOwnerBody = (body) =>
              !body.includes('<!-- capy-review:') && !body.includes('<!-- capy-pages-preview -->');

            for (const r of reviews) {
              if (!ALLOWED_OWNER_LOGINS.has(r.user?.login?.toLowerCase())) continue;
              if (r.state === 'PENDING') continue;
              const body = (r.body || '').trim();
              if (!isHumanOwnerBody(body)) continue;
              const ts = Date.parse(r.submitted_at || '') || 0;
              const id = Number(r.id) || 0;
              const isExactHead = r.commit_id === headSha;

              if (isExactHead && ts >= latestForcePushMs && ts > 0) {
                if (earliestExactHeadReviewMs === 0 || ts < earliestExactHeadReviewMs) {
                  earliestExactHeadReviewMs = ts;
                }
              }
              if (r.state === 'DISMISSED') continue;

              const isRejectionBody = /^(?:CHANGES\s+REQUESTED|HOLD|DO\s+NOT\s+MERGE)\b/i.test(body);
              const isExactHeadNativeApproval =
                r.state === 'APPROVED' && isExactHead && !isRejectionBody;
              const isRejection = r.state === 'CHANGES_REQUESTED' || isRejectionBody;

              if (isExactHeadNativeApproval) {
                if (ts >= latestForcePushMs) {
                  nativeHeadApprovals.push({ ts, id, source: 'review' });
                }
              } else if (isRejection) {
                if (ts >= latestForcePushMs) {
                  rejectionCandidates.push({ ts, id, source: 'review', exactHead: isExactHead });
                }
              }
            }

            for (const c of comments) {
              if (!ALLOWED_OWNER_LOGINS.has(c.user?.login?.toLowerCase())) continue;
              const body = (c.body || '').trim();
              if (!isHumanOwnerBody(body)) continue;
              const ts = Date.parse(c.updated_at || c.created_at || '') || 0;
              const id = Number(c.id) || 0;

              if (/^(?:CHANGES\s+REQUESTED|HOLD|DO\s+NOT\s+MERGE)\b/i.test(body)) {
                if (ts >= latestForcePushMs) {
                  rejectionCandidates.push({ ts, id, source: 'comment', exactHead: false });
                }
              }
            }

            const maxSignalTs = (signals) =>
              signals.reduce((maxTs, s) => (s.ts > maxTs ? s.ts : maxTs), 0);

            const effectiveOwnerApprovals = nativeHeadApprovals;
            const effectiveOwnerApprovalMs = maxSignalTs(effectiveOwnerApprovals);

            const skewAnchorCandidates = [
              effectiveOwnerApprovalMs,
              earliestExactHeadReviewMs,
              earliestExactHeadAiMs,
              earliestHeadStatusMs,
            ].filter((ts) => ts > 0);
            const skewAnchorMs =
              skewAnchorCandidates.length > 0 ? Math.min(...skewAnchorCandidates) : 0;
            const rejectionFloorMs = Math.max(
              latestForcePushMs,
              Math.min(latestPushMs, skewAnchorMs || latestPushMs)
            );

            const activeRejections = rejectionCandidates.filter((rej) =>
              rej.exactHead ? rej.ts >= latestForcePushMs : rej.ts >= rejectionFloorMs
            );

            const compareReviewOrder = (a, b) => (a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]);
            const isApprovalStrictlyNewerThanRejection = (approval, rejection) => {
              if (!approval || !rejection) return false;
              if (approval.ts !== rejection.ts) return approval.ts > rejection.ts;
              if (
                approval.source === rejection.source &&
                approval.id > 0 &&
                rejection.id > 0
              ) {
                return compareReviewOrder([approval.ts, approval.id], [rejection.ts, rejection.id]) > 0;
              }
              return false;
            };

            const hasActiveOwnerRejection = activeRejections.some(
              (rej) =>
                !effectiveOwnerApprovals.some((app) =>
                  isApprovalStrictlyNewerThanRejection(app, rej)
                )
            );
            const changesRequested = aiChangesRequested || hasActiveOwnerRejection;

            // 2b. Verify clean origin/main -> beta ancestry sync PRs (zero unreviewed commits or evil-merge diffs)
            let isVerifiedMainSync = false;
            if (
              isBetaTarget &&
              !isDraft &&
              !changesRequested &&
              !aiApproved &&
              pr.head?.ref === 'sync/beta-from-main' &&
              pr.head?.repo?.full_name === `${owner}/${repo}`
            ) {
              try {
                const [{ data: mainCommit }, { data: betaCommit }] = await Promise.all([
                  github.rest.repos.getCommit({ owner, repo, ref: 'heads/main' }),
                  github.rest.repos.getCommit({ owner, repo, ref: 'heads/beta' }),
                ]);
                const mainSha = mainCommit?.sha;
                const betaSha = betaCommit?.sha;
                const headTreeSha = headCommit?.commit?.tree?.sha;
                const mainTreeSha = mainCommit?.commit?.tree?.sha;

                if (mainSha && betaSha && headTreeSha && mainTreeSha) {
                  const [
                    { data: cmpHeadToMain },
                    { data: cmpHeadToBeta },
                    { data: cmpMainToBeta },
                  ] = await Promise.all([
                    github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${headSha}...${mainSha}`,
                    }),
                    github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${headSha}...${betaSha}`,
                    }),
                    github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${mainSha}...${betaSha}`,
                    }),
                  ]);
                  const mainIsAncestorOfHead = cmpHeadToMain?.ahead_by === 0;
                  const betaIsAncestorOfHead = cmpHeadToBeta?.ahead_by === 0;
                  const betaIsAncestorOfMain = cmpMainToBeta?.ahead_by === 0;

                  if (mainIsAncestorOfHead && betaIsAncestorOfHead) {
                    if (betaIsAncestorOfMain) {
                      const cmpMainToHead =
                        headSha === mainSha
                          ? { ahead_by: 0, total_commits: 0 }
                          : (
                              await github.rest.repos.compareCommitsWithBasehead({
                                owner,
                                repo,
                                basehead: `${mainSha}...${headSha}`,
                              })
                            ).data;
                      const isExactFastForwardSync =
                        headSha === mainSha &&
                        headTreeSha === mainTreeSha &&
                        cmpHeadToMain?.ahead_by === 0 &&
                        (cmpHeadToMain?.total_commits ?? 0) === 0 &&
                        cmpMainToHead?.ahead_by === 0 &&
                        (cmpMainToHead?.total_commits ?? 0) === 0;
                      const mergeCommit =
                        Array.isArray(cmpMainToHead?.commits) && cmpMainToHead.commits.length === 1
                          ? cmpMainToHead.commits[0]
                          : null;
                      const mergeParentShas = (mergeCommit?.parents || [])
                        .map((p) => p?.sha)
                        .filter(Boolean);
                      const isExactCleanNoFfSync =
                        betaSha !== mainSha &&
                        headSha !== mainSha &&
                        headTreeSha === mainTreeSha &&
                        cmpHeadToMain?.ahead_by === 0 &&
                        (cmpHeadToMain?.total_commits ?? 0) === 0 &&
                        cmpMainToHead?.ahead_by === 1 &&
                        (cmpMainToHead?.total_commits ?? 0) === 1 &&
                        (cmpMainToHead?.files || []).length === 0 &&
                        mergeCommit?.sha === headSha &&
                        mergeParentShas.length === 2 &&
                        new Set(mergeParentShas).size === 2 &&
                        mergeParentShas.includes(betaSha) &&
                        mergeParentShas.includes(mainSha);
                      if (isExactFastForwardSync || isExactCleanNoFfSync) {
                        isVerifiedMainSync = true;
                      }
                    } else {
                      const mergeBaseSha = cmpMainToBeta?.merge_base_commit?.sha;
                      if (mergeBaseSha) {
                        const [
                          { data: prDiff },
                          { data: betaFromBase },
                          { data: mainFromBase },
                        ] = await Promise.all([
                          github.rest.repos.compareCommitsWithBasehead({
                            owner,
                            repo,
                            basehead: `${betaSha}...${headSha}`,
                          }),
                          github.rest.repos.compareCommitsWithBasehead({
                            owner,
                            repo,
                            basehead: `${mergeBaseSha}...${betaSha}`,
                          }),
                          github.rest.repos.compareCommitsWithBasehead({
                            owner,
                            repo,
                            basehead: `${mergeBaseSha}...${mainSha}`,
                          }),
                        ]);

                        const isNonTruncatedCompare = (cmp) => {
                          const commits = cmp?.commits || [];
                          const files = cmp?.files || [];
                          const total = cmp?.total_commits ?? commits.length;
                          return commits.length < 250 && total === commits.length && files.length < 300;
                        };

                        const prCommits = prDiff?.commits || [];
                        const prFiles = prDiff?.files || [];
                        const betaBaseFiles = betaFromBase?.files || [];
                        const mainBaseCommits = mainFromBase?.commits || [];
                        const mainBaseFiles = mainFromBase?.files || [];
                        const mainAncestorSet = new Set([
                          mainSha,
                          mergeBaseSha,
                          ...mainBaseCommits.map((c) => c.sha).filter(Boolean),
                        ]);

                        let allCommitsClean =
                          prCommits.length > 0 &&
                          isNonTruncatedCompare(prDiff) &&
                          isNonTruncatedCompare(betaFromBase) &&
                          isNonTruncatedCompare(mainFromBase);

                        if (allCommitsClean) {
                          for (const c of prCommits) {
                            if (c.sha === headSha) {
                              const parentShas = (c.parents || []).map((p) => p.sha);
                              if (parentShas.length !== 2) {
                                allCommitsClean = false;
                                break;
                              }
                              for (const pSha of parentShas) {
                                if (pSha === betaSha || mainAncestorSet.has(pSha)) continue;
                                const { data: cmpParentToMain } =
                                  await github.rest.repos.compareCommitsWithBasehead({
                                    owner,
                                    repo,
                                    basehead: `${mainSha}...${pSha}`,
                                  });
                                if (cmpParentToMain?.ahead_by !== 0) {
                                  allCommitsClean = false;
                                  break;
                                }
                              }
                              if (!allCommitsClean) break;
                              continue;
                            }
                            if (mainAncestorSet.has(c.sha)) continue;
                            const { data: cmpCommitToMain } =
                              await github.rest.repos.compareCommitsWithBasehead({
                                owner,
                                repo,
                                basehead: `${mainSha}...${c.sha}`,
                              });
                            if (cmpCommitToMain?.ahead_by !== 0) {
                              allCommitsClean = false;
                              break;
                            }
                          }
                        }

                        if (allCommitsClean) {
                          const betaTouchedFiles = new Set();
                          for (const f of betaBaseFiles) {
                            if (f?.filename) betaTouchedFiles.add(f.filename);
                            if (f?.previous_filename) betaTouchedFiles.add(f.previous_filename);
                          }

                          const mainFromBaseMap = new Map();
                          for (const f of mainBaseFiles) {
                            if (f?.filename) mainFromBaseMap.set(f.filename, f);
                          }

                          const prFilesMap = new Map();
                          for (const f of prFiles) {
                            if (f?.filename) prFilesMap.set(f.filename, f);
                          }

                          let filesClean = mainFromBaseMap.size > 0 && prFilesMap.size === mainFromBaseMap.size;
                          if (filesClean) {
                            for (const filename of prFilesMap.keys()) {
                              if (!mainFromBaseMap.has(filename)) {
                                filesClean = false;
                                break;
                              }
                            }
                          }
                          if (filesClean) {
                            for (const [filename, mainFile] of mainFromBaseMap.entries()) {
                              if (
                                betaTouchedFiles.has(filename) ||
                                (mainFile.previous_filename &&
                                  betaTouchedFiles.has(mainFile.previous_filename))
                              ) {
                                filesClean = false;
                                break;
                              }
                              const prFile = prFilesMap.get(filename);
                              if (
                                !prFile ||
                                prFile.status !== mainFile.status ||
                                (prFile.sha || '') !== (mainFile.sha || '') ||
                                (prFile.previous_filename || '') !==
                                  (mainFile.previous_filename || '')
                              ) {
                                filesClean = false;
                                break;
                              }
                            }
                          }

                          if (filesClean) {
                            isVerifiedMainSync = true;
                          }
                        }
                      }
                    }
                  }
                }
              } catch (err) {
                core.warning(
                  `Main-sync ancestry verification failed closed for PR #${prNumber}: ${err.message}`
                );
                isVerifiedMainSync = false;
              }
            }

            const ownerApproved = effectiveOwnerApprovals.length > 0;
            const aiOrSyncReady = aiApproved || (isBetaTarget && isVerifiedMainSync);
            const strictAiReady = !isDraft && !changesRequested && aiOrSyncReady;
            const gatePassed = strictAiReady && (isBetaTarget || ownerApproved);

            // 3. Dismiss any legacy github-actions[bot] formal PR approvals
            const botReviews = reviews.filter(
              (r) => r.user?.login === 'github-actions[bot]' && r.state === 'APPROVED'
            );
            if (!isReadOnlyDependabotEvent) {
              for (const br of botReviews) {
                try {
                  await github.rest.pulls.dismissReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    review_id: br.id,
                    message:
                      'Bot review rubber-stamping is removed; strict 100% AI review drives auto-merge directly.',
                  });
                } catch (err) {
                  core.warning(`Failed to dismiss bot review ${br.id}: ${err.message}`);
                }
              }
            }

            // 4. Post Commit Status capy/review-gate on headSha (<= 140 chars) & upsert gate status comment
            const blockers = [];
            if (changesRequested) blockers.push('Changes requested / hold');
            if (isDraft) blockers.push('Draft PR');
            if (!isBetaTarget && !ownerApproved) blockers.push('Owner Approve');
            if (!aiOrSyncReady) {
              if (latestAiSignal !== null && !hasValidAiMarker) {
                blockers.push('PR readiness/100% score');
              } else {
                blockers.push('AI review');
              }
            }

            const targetScope = isBetaTarget
              ? 'Beta (no Owner approval needed)'
              : 'Main (Owner Approve required)';

            let state = 'pending';
            let description = `${targetScope}: Blocked by ${blockers.join(', ') || 'Pending checks'}`;
            if (changesRequested) {
              state = 'failure';
            } else if (gatePassed) {
              state = 'success';
              if (isBetaTarget) {
                description =
                  isVerifiedMainSync && !aiApproved
                    ? 'Beta gate passed (no Owner approval needed): verified origin/main sync'
                    : 'Beta gate passed (no Owner approval needed): AI review (100%) verified';
              } else {
                description =
                  'Main gate passed (Owner Approve verified): AI review (100%) + Owner Approve';
              }
            }

            const clippedDesc = description.slice(0, 140);
            const latestGateStatus = existingStatuses.find(
              (s) => s.context === 'capy/review-gate'
            );
            const targetUrl =
              context.serverUrl && context.runId
                ? `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
                : `https://github.com/${owner}/${repo}/pull/${prNumber}`;
            if (
              !latestGateStatus ||
              latestGateStatus.state !== state ||
              latestGateStatus.description !== clippedDesc ||
              !latestGateStatus.target_url
            ) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  context: 'capy/review-gate',
                  state,
                  description: clippedDesc,
                  target_url: targetUrl,
                });
              } catch (err) {
                const isForbidden = Number(err?.status) === 403;
                const fallbackToken = (process.env.ACTIONS_GITHUB_TOKEN || '').trim();
                if (isReadOnlyDependabotEvent && isForbidden) {
                  core.warning(
                    `Read-only GITHUB_TOKEN on Dependabot ${context.eventName} event prevented updating capy/review-gate status: ${err.message}`
                  );
                } else if (isForbidden && !isReadOnlyDependabotEvent && fallbackToken) {
                  core.warning(
                    `Primary token returned 403 when updating capy/review-gate status; retrying with ACTIONS_GITHUB_TOKEN.`
                  );
                  const statusRes = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/statuses/${headSha}`,
                    {
                      method: 'POST',
                      headers: {
                        Accept: 'application/vnd.github+json',
                        Authorization: `Bearer ${fallbackToken}`,
                        'Content-Type': 'application/json',
                        'User-Agent': 'capy-pr-review-gate',
                        'X-GitHub-Api-Version': '2022-11-28',
                      },
                      body: JSON.stringify({
                        state,
                        target_url: targetUrl,
                        description: clippedDesc,
                        context: 'capy/review-gate',
                      }),
                    }
                  );
                  if (!statusRes.ok) {
                    const statusErrText =
                      typeof statusRes.text === 'function' ? await statusRes.text() : '';
                    throw new Error(
                      `Fallback createCommitStatus failed with HTTP ${statusRes.status}: ${statusErrText.slice(0, 300)}`
                    );
                  }
                } else {
                  throw err;
                }
              }
            }

            const gateStatusHeading = isBetaTarget
              ? '**Target**: `beta` (**Owner approval NOT required**)'
              : '**Target**: `main` (**Owner Approve REQUIRED**)';
            const gateStatusSummary = gatePassed
              ? '**Status**: All gate requirements satisfied — ready to merge'
              : `**Blocked by**: ${blockers.join(', ')}`;
            const readinessValid =
              isStrictPrBodyValid && (!latestAiSignal || isStrictAiBodyValid);
            const gateChecklistLines = [
              `- [${aiOrSyncReady ? 'x' : ' '}] **AI Review (100% + \`review:ai-approved\`)**${isBetaTarget && isVerifiedMainSync && !aiApproved ? ' (verified `origin/main` ancestry sync)' : ''}`,
              ...(!isBetaTarget
                ? [
                    `- [${ownerApproved ? 'x' : ' '}] **Owner Approve** (native \`APPROVED\` review on HEAD by \`shthed\` or \`capyboop\`)`,
                  ]
                : []),
              `- [${readinessValid ? 'x' : ' '}] **PR Description & Readiness** (\`## Summary\`, \`PR Readiness Score: 100%\`, zero unchecked tasks)`,
              `- [${!changesRequested ? 'x' : ' '}] **No Active Holds / Changes Requested**`,
              ...(isDraft ? ['- [ ] **Ready for Review** (PR is currently a Draft)'] : []),
            ];
            const gateCommentBody = [
              '<!-- capy-gate-status -->',
              '### Review Gate Status',
              '',
              `- ${gateStatusHeading}`,
              `- ${gateStatusSummary}`,
              `- **HEAD**: \`${headSha.slice(0, 7)}\``,
              '',
              ...gateChecklistLines,
            ].join('\n');

            if (!isReadOnlyDependabotEvent) {
              try {
                const existingGateComment = comments.find((c) =>
                  (c.body || '').includes('<!-- capy-gate-status -->')
                );
                if (existingGateComment) {
                  if ((existingGateComment.body || '') !== gateCommentBody) {
                    await github.rest.issues.updateComment({
                      owner,
                      repo,
                      comment_id: existingGateComment.id,
                      body: gateCommentBody,
                    });
                  }
                } else {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: gateCommentBody,
                  });
                }
              } catch (err) {
                core.warning(
                  `Failed to upsert capy-gate-status comment on PR #${prNumber}: ${err.message}`
                );
              }
            }

            // 5. Enable Auto-Merge (or merge immediately if clean) once strict 100% AI gate passes
            if (!isReadOnlyDependabotEvent && typeof github.graphql === 'function' && pr.node_id) {
              if (state === 'success' && !isDraft) {
                const needsMergeCommit =
                  baseRef === 'main' ||
                  pr.head?.ref === 'sync/beta-from-main' ||
                  isVerifiedMainSync;
                const existingMethod = pr.auto_merge?.merge_method
                  ? String(pr.auto_merge.merge_method).toUpperCase()
                  : null;
                const desiredMergeMethod = needsMergeCommit
                  ? 'MERGE'
                  : existingMethod || 'SQUASH';

                if (!pr.auto_merge || existingMethod !== desiredMergeMethod) {
                  try {
                    await github.graphql(
                      `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                        enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                          pullRequest { number }
                        }
                      }`,
                      {
                        pullRequestId: pr.node_id,
                        mergeMethod: desiredMergeMethod,
                      }
                    );
                  } catch (err) {
                    const msg = String(err?.message || err || '');
                    if (/clean status/i.test(msg)) {
                      try {
                        await github.rest.pulls.merge({
                          owner,
                          repo,
                          pull_number: prNumber,
                          sha: headSha,
                          merge_method: desiredMergeMethod.toLowerCase(),
                        });
                      } catch (mergeErr) {
                        core.warning(
                          `Immediate merge after clean status failed for PR #${prNumber}: ${mergeErr.message}`
                        );
                      }
                    } else {
                      core.warning(
                        `Auto-merge enablement warning for PR #${prNumber}: ${msg}`
                      );
                    }
                  }
                }
              } else if (
                pr.auto_merge &&
                (state === 'failure' ||
                  isDraft ||
                  hadAiApprovedLabel ||
                  (latestAiSignal !== null && !hasValidAiMarker))
              ) {
                try {
                  await github.graphql(
                    `mutation($pullRequestId: ID!) {
                      disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) {
                        pullRequest { number }
                      }
                    }`,
                    {
                      pullRequestId: pr.node_id,
                    }
                  );
                } catch (err) {
                  core.warning(`Failed to disable auto-merge on held PR #${prNumber}: ${err.message}`);
                }
              }
            }

  ai-review:
    name: Automated AI PR Reviewer
    if: >-
      github.repository == 'shthed/capy' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run automated AI review on ready --base beta PRs
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber =
              context.payload.pull_request?.number ||
              (Number(context.payload.inputs?.pr_number || 0) || null);
            if (!prNumber) {
              core.info('No pull request number associated with event; skipping AI review.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state}; skipping AI review.`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${prNumber} is a draft; skipping AI review until ready.`);
              return;
            }
            const baseRef = (pr.base?.ref || '').trim();
            const headRef = (pr.head?.ref || '').trim();
            if (baseRef !== 'beta') {
              core.info(`PR #${prNumber} targets ${baseRef} (not beta); skipping automated AI review.`);
              return;
            }
            if (headRef === 'sync/beta-from-main') {
              core.info(`PR #${prNumber} is sync/beta-from-main; handled by verified ancestry sync.`);
              return;
            }
            if (pr.head?.repo?.full_name !== `${owner}/${repo}`) {
              core.info(`PR #${prNumber} is from a fork; skipping automated AI review.`);
              return;
            }

            const headSha = pr.head.sha;
            const markerRegex = new RegExp(
              `<!--\\s*capy-review:\\s*actor=ai-agent\\s+verdict=(APPROVED|CHANGES_REQUESTED)\\s+sha=${headSha}\\s+score=([0-9]+(?:\\.[0-9]+)?)%?[^>]*-->`,
              'i'
            );
            const ALLOWED_LOGINS = new Set([owner.toLowerCase(), 'capyboop', 'github-actions[bot]']);
            const ALLOWED_ASSOC = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isTrusted = (item) =>
              ALLOWED_LOGINS.has((item?.user?.login || '').toLowerCase()) ||
              ALLOWED_ASSOC.has(String(item?.author_association || '').toUpperCase());

            const [reviews, comments] = await Promise.all([
              github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 }),
              github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }),
            ]);
            const alreadyReviewed =
              reviews.some((r) => String(r?.state || '').toUpperCase() !== 'DISMISSED' && isTrusted(r) && markerRegex.test(r.body || '')) ||
              comments.some((c) => isTrusted(c) && markerRegex.test(c.body || ''));
            if (alreadyReviewed) {
              core.info(`PR #${prNumber} (${headSha}) already has a trusted AI review marker; skipping.`);
              return;
            }

            const apiKey = (process.env.GEMINI_API_KEY || '').trim();
            if (!apiKey) {
              core.warning(
                `GEMINI_API_KEY is not configured in repository Actions secrets; cannot run automated AI review on PR #${prNumber}. Configure GEMINI_API_KEY in Settings -> Secrets and variables -> Actions.`
              );
              return;
            }

            const { data: diffRaw } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
              mediaType: { format: 'diff' },
            });
            const diffText = String(diffRaw || '');
            const maxDiffChars = 100000;
            const clippedDiff =
              diffText.length > maxDiffChars
                ? `${diffText.slice(0, maxDiffChars)}\n... [diff truncated at ${maxDiffChars} chars]`
                : diffText;

            const prompt = [
              'You are an independent AI code reviewer for shthed/capy.',
              'Evaluate the pull request against AGENTS.md Golden Invariants:',
              '1. PR body must have ## Summary at the top and ### PR Readiness Score: 100% at the end with zero <100% items and zero unchecked - [ ] tasks.',
              '2. No security issues, hardcoded secrets, broken workflows, or regressions.',
              '3. Zero emojis or ASCII art in .md files.',
              'Return strict JSON with keys: "verdict" ("APPROVED" or "CHANGES_REQUESTED"), "score" (integer 0-100), and "summary" (concise markdown review).',
              `PR #${prNumber}: ${pr.title}`,
              `Head SHA: ${headSha}`,
              `PR Body:\n${pr.body || '(empty)'}`,
              `Diff:\n${clippedDiff}`,
            ].join('\n\n');

            const GEMINI_MODELS = [
              'gemini-3.8-flash',
              'gemini-4-argon',
              'gemini-2.5-flash',
            ];
            let payload = null;
            for (let i = 0; i < GEMINI_MODELS.length; i++) {
              const model = GEMINI_MODELS[i];
              const resp = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': apiKey,
                  },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: 'application/json', temperature: 0.1 },
                  }),
                }
              );
              if (resp.ok) {
                payload = await resp.json();
                break;
              }
              const errText = typeof resp.text === 'function' ? await resp.text() : '';
              if (resp.status === 404 && i < GEMINI_MODELS.length - 1) {
                core.warning(
                  `Gemini model ${model} returned HTTP 404; retrying with ${GEMINI_MODELS[i + 1]}.`
                );
                continue;
              }
              throw new Error(`Gemini API HTTP ${resp.status} (${model}): ${errText.slice(0, 300)}`);
            }
            const rawText = payload?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const parsed = JSON.parse(rawText);
            const verdict = String(parsed?.verdict || '').toUpperCase();
            const score = Math.round(Number(parsed?.score));
            const summary = String(parsed?.summary || '').trim() || 'Automated AI review completed.';
            if ((verdict !== 'APPROVED' && verdict !== 'CHANGES_REQUESTED') || !Number.isFinite(score) || score < 0 || score > 100) {
              throw new Error(`Invalid AI review JSON response: ${rawText.slice(0, 300)}`);
            }

            const reviewBody = [
              summary,
              '',
              `<!-- capy-review: actor=ai-agent verdict=${verdict} sha=${headSha} score=${score}% -->`,
            ].join('\n');

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              commit_id: headSha,
              event: 'COMMENT',
              body: reviewBody,
            });

            if (verdict === 'APPROVED' && score === 100) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['review:ai-approved'],
              });
            } else if (verdict === 'CHANGES_REQUESTED') {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['review:changes-requested'],
              });
            }

