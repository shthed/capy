name: Publish Clean Mirror to capyboop/paint

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_clean_root:
        description: 'Reset capyboop/paint main to a fresh clean-room history authored by capyboop'
        required: false
        default: false
        type: boolean
      replay_full_history:
        description: 'Replay entire shthed/capy main commit history as clean capyboop commits'
        required: false
        default: false
        type: boolean
      migrate_issues:
        description: 'Copy open issues from capyboop/capy to capyboop/paint as capyboop'
        required: false
        default: false
        type: boolean
      migrate_public_epics:
        description: 'Copy sanitized EPIC-2..EPIC-5 from shthed/capy to capyboop/paint and close them on shthed/capy'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-capyboop
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    name: Export & Push Clean capyboop Release
    if: github.repository == 'shthed/capy'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check CAPYBOOP_SYNC_TOKEN configuration
        id: check_secret
        env:
          HAS_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### capyboop/paint Auto-Publish Skipped (Token Not Configured)"
              echo ""
              echo "Add fine-grained Personal Access Token secret \`CAPYBOOP_SYNC_TOKEN\` (scoped to \`capyboop/paint\` with **Contents: Read & write** and **Workflows: Read & write**) under \`shthed/capy\` **Settings -> Secrets and variables -> Actions -> Secrets** to publish every \`main\` merge automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout source repository
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Export clean-room capyboop workspace and verify zero leaks
        if: steps.check_secret.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node web/scripts/rebrand-persona.mjs --stage-dir /tmp/capyboop-stage
          COMMIT_MSG="$(git log -1 --format=%s | node web/scripts/rebrand-persona.mjs --sanitize-message)"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('/tmp/capyboop-stage/web/package.json', 'utf8')).version")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer in staged web/package.json: ${VERSION}" >&2
            exit 1
          fi
          DELIM="EOF_COMMIT_MSG_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'commit_msg<<%s\n%s\n%s\n' "${DELIM}" "${COMMIT_MSG}" "${DELIM}"
            printf 'version=%s\n' "${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Commit as capyboop, push main, and sync release tag on capyboop/paint
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          CAPYBOOP_SYNC_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN }}
          RESET_CLEAN_ROOT: ${{ inputs.reset_clean_root == true }}
          REPLAY_FULL_HISTORY: ${{ inputs.replay_full_history == true }}
          SOURCE_REPO_DIR: ${{ github.workspace }}
          GIT_AUTHOR_NAME: capyboop
          GIT_AUTHOR_EMAIL: 354866242+capyboop@users.noreply.github.com
          GIT_COMMITTER_NAME: capyboop
          GIT_COMMITTER_EMAIL: 354866242+capyboop@users.noreply.github.com
        run: |
          set -euo pipefail
          cd /tmp/capyboop-stage

          ASKPASS_SCRIPT="$(mktemp)"
          LOG_FILE="$(mktemp)"
          cleanup() {
            rm -f "${ASKPASS_SCRIPT}" "${LOG_FILE}"
          }
          trap cleanup EXIT

          chmod 700 "${ASKPASS_SCRIPT}"
          cat <<'EOF' > "${ASKPASS_SCRIPT}"
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "${CAPYBOOP_SYNC_TOKEN}" ;;
          esac
          EOF
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          git init -b main
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config credential.helper ""
          git remote add target "https://x-access-token@github.com/capyboop/paint.git"
          git add -A

          NEEDS_CLEAN_RESET="false"
          if [ "${RESET_CLEAN_ROOT}" = "true" ] || [ "${REPLAY_FULL_HISTORY}" = "true" ]; then
            NEEDS_CLEAN_RESET="true"
          fi

          replay_full_clean_history() {
            node - "${SOURCE_REPO_DIR}" "${GIT_AUTHOR_NAME}" "${GIT_AUTHOR_EMAIL}" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const [srcRepo, authorName, authorEmail] = process.argv.slice(2);
          const { exportCleanPersonaStage, sanitizeCommitMessage } = await import(
            path.join(srcRepo, 'web/scripts/rebrand-persona.mjs')
          );

          const histSrc = '/tmp/capyboop-hist-src';
          const histStage = '/tmp/capyboop-hist-stage';
          const histDst = '/tmp/capyboop-hist-dst';
          fs.rmSync(histSrc, { recursive: true, force: true });
          fs.rmSync(histStage, { recursive: true, force: true });
          fs.rmSync(histDst, { recursive: true, force: true });

          execFileSync('git', ['-C', srcRepo, 'worktree', 'add', '--detach', histSrc, 'HEAD'], { stdio: 'ignore' });
          execFileSync('git', ['init', '-b', 'main', histDst], { stdio: 'ignore' });
          execFileSync('git', ['-C', histDst, 'config', 'user.name', authorName], { stdio: 'ignore' });
          execFileSync('git', ['-C', histDst, 'config', 'user.email', authorEmail], { stdio: 'ignore' });

          const commits = execFileSync('git', ['-C', srcRepo, 'rev-list', '--topo-order', '--reverse', 'HEAD'], {
            encoding: 'utf8',
          })
            .trim()
            .split('\n')
            .filter(Boolean);

          const cleanMap = new Map();
          let lastCleanSha = '';

          for (const origSha of commits) {
            const meta = execFileSync(
              'git',
              ['-C', srcRepo, 'show', '-s', '--format=%P%x1f%aI%x1f%cI%x1f%B', origSha],
              { encoding: 'utf8' }
            );
            const [parentsStr, authorDate, committerDate, rawMsg] = meta.split('\x1f');
            const origParents = parentsStr ? parentsStr.trim().split(/\s+/).filter(Boolean) : [];
            const cleanParents = origParents.map((p) => cleanMap.get(p)).filter(Boolean);

            execFileSync('git', ['-C', histSrc, 'checkout', '-f', '--detach', origSha], { stdio: 'ignore' });
            fs.rmSync(histStage, { recursive: true, force: true });
            try {
              exportCleanPersonaStage({ repoRoot: histSrc, stageDir: histStage });
            } catch {
              // Historical commits may contain legacy persona tokens in files later cleaned; HEAD is strictly verified.
            }

            for (const entry of fs.readdirSync(histDst)) {
              if (entry === '.git') continue;
              fs.rmSync(path.join(histDst, entry), { recursive: true, force: true });
            }
            for (const entry of fs.readdirSync(histStage)) {
              fs.cpSync(path.join(histStage, entry), path.join(histDst, entry), { recursive: true });
            }

            execFileSync('git', ['-C', histDst, 'add', '-A'], { stdio: 'ignore' });
            const treeSha = execFileSync('git', ['-C', histDst, 'write-tree'], { encoding: 'utf8' }).trim();
            const scrubHistMsg = (m) =>
              m
                .replace(/pr-review-gate/gi, 'review-gate')
                .replace(/publish-capyboop/gi, 'publish-mirror')
                .replace(/rebrand-persona/gi, 'persona-export')
                .replace(/open-pr\.yml/gi, 'open-pr')
                .replace(/persona:capyboop/gi, 'persona:mirror')
                .replace(/capy-dev-only/gi, 'dev-only')
                .replace(/sync-beta-from-main/gi, 'sync-beta')
                .replace(/sync-agile-tracker/gi, 'sync-tracker')
                .replace(/dependabot\.ya?ml/gi, 'dependabot')
                .replace(/CAPYBOOP_SYNC_TOKEN/gi, 'SYNC_TOKEN');
            let cleanMsg = '';
            try {
              cleanMsg = sanitizeCommitMessage((rawMsg || '').trim());
            } catch {
              try {
                cleanMsg = sanitizeCommitMessage(scrubHistMsg((rawMsg || '').trim()));
              } catch {
                cleanMsg = `Historical commit ${origSha.slice(0, 7)}`;
              }
            }
            cleanMsg = cleanMsg || `Commit ${origSha.slice(0, 7)}`;

            const commitArgs = ['-C', histDst, 'commit-tree', treeSha];
            for (const cp of cleanParents) {
              commitArgs.push('-p', cp);
            }
            commitArgs.push('-m', cleanMsg);

            const cleanSha = execFileSync('git', commitArgs, {
              encoding: 'utf8',
              env: {
                ...process.env,
                GIT_AUTHOR_NAME: authorName,
                GIT_AUTHOR_EMAIL: authorEmail,
                GIT_COMMITTER_NAME: authorName,
                GIT_COMMITTER_EMAIL: authorEmail,
                GIT_AUTHOR_DATE: authorDate.trim(),
                GIT_COMMITTER_DATE: committerDate.trim(),
              },
            }).trim();
            cleanMap.set(origSha, cleanSha);
            lastCleanSha = cleanSha;
          }

          execFileSync('git', ['-C', histDst, 'update-ref', 'refs/heads/main', lastCleanSha], { stdio: 'ignore' });
          execFileSync('git', ['-C', srcRepo, 'worktree', 'remove', '--force', histSrc], { stdio: 'ignore' });
          process.stdout.write(`${lastCleanSha}\n`);
          NODE
          }

          PUSHED_COMMIT_SHA=""
          MAIN_LS_RC=0
          git ls-remote --exit-code --heads target main >/dev/null || MAIN_LS_RC=$?
          if [ "${MAIN_LS_RC}" -eq 0 ]; then
            git fetch target main
            git log FETCH_HEAD --format="%an %ae %cn %ce %B%x00" > "${LOG_FILE}"
            GREP_RC=0
            grep -iaqzE "shthed|hairy[[:space:]_-]*dog[[:space:]_-]*trumpet|381055\+|CAPYBOOP_SYNC_TOKEN|rebrand-persona|publish-capyboop|pr-review-gate|open-pr\.yml|persona:capyboop|capy-dev-only|sync-beta-from-main|sync-agile-tracker|dependabot\.ya?ml" "${LOG_FILE}" || GREP_RC=$?
            if [ "${GREP_RC}" -eq 0 ]; then
              NEEDS_CLEAN_RESET="true"
            elif [ "${GREP_RC}" -ne 1 ]; then
              echo "Failed to scan FETCH_HEAD commit history (grep exit ${GREP_RC})." >&2
              exit "${GREP_RC}"
            fi

            if [ "${NEEDS_CLEAN_RESET}" = "true" ]; then
              echo "Replaying full clean-room commit history authored solely by capyboop..."
              PUSHED_COMMIT_SHA="$(replay_full_clean_history)"
              git -C /tmp/capyboop-hist-dst remote add target "https://x-access-token@github.com/capyboop/paint.git"
              git -C /tmp/capyboop-hist-dst config credential.helper ""
              git -C /tmp/capyboop-hist-dst push --force target "${PUSHED_COMMIT_SHA}:refs/heads/main"
            else
              # shthed/capy main is the canonical tree source; external PRs merged on capyboop/paint
              # must be back-ported into shthed/capy (beta -> main) before pushing to main.
              TREE_SHA="$(git write-tree)"
              REMOTE_TREE_SHA="$(git rev-parse FETCH_HEAD^{tree})"
              if [ "${TREE_SHA}" = "${REMOTE_TREE_SHA}" ]; then
                echo "capyboop/paint main already matches clean tree (${TREE_SHA})."
                PUSHED_COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
              else
                PARENT_SHA="$(git rev-parse FETCH_HEAD)"
                NEW_COMMIT="$(git commit-tree "${TREE_SHA}" -p "${PARENT_SHA}" -m "${commit_msg}")"
                PUSHED_COMMIT_SHA="${NEW_COMMIT}"
                git push target "${PUSHED_COMMIT_SHA}:refs/heads/main"
              fi
            fi
          elif [ "${MAIN_LS_RC}" -eq 2 ]; then
            echo "Target repository has no main branch yet; replaying full clean-room commit history..."
            PUSHED_COMMIT_SHA="$(replay_full_clean_history)"
            git -C /tmp/capyboop-hist-dst remote add target "https://x-access-token@github.com/capyboop/paint.git"
            git -C /tmp/capyboop-hist-dst config credential.helper ""
            git -C /tmp/capyboop-hist-dst push --force target "${PUSHED_COMMIT_SHA}:refs/heads/main"
          else
            echo "git ls-remote --heads target main failed with exit code ${MAIN_LS_RC}." >&2
            exit "${MAIN_LS_RC}"
          fi

          TAG_NAME="v${version}"
          TAG_REPO_DIR="/tmp/capyboop-stage"
          if [ -d /tmp/capyboop-hist-dst/.git ]; then
            TAG_REPO_DIR="/tmp/capyboop-hist-dst"
          fi
          if ! git -C "${SOURCE_REPO_DIR}" rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} does not exist on source repository; skipping tag push to capyboop/paint."
          elif [ "${NEEDS_CLEAN_RESET}" = "true" ]; then
            echo "Force-syncing release tag ${TAG_NAME} (${PUSHED_COMMIT_SHA}) onto clean root..."
            git -C "${TAG_REPO_DIR}" tag -f "${TAG_NAME}" "${PUSHED_COMMIT_SHA}"
            git -C "${TAG_REPO_DIR}" push --force target "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          else
            TAG_LS_RC=0
            git ls-remote --exit-code --tags target "refs/tags/${TAG_NAME}" >/dev/null || TAG_LS_RC=$?
            if [ "${TAG_LS_RC}" -eq 2 ]; then
              echo "Pushing release tag ${TAG_NAME} (${PUSHED_COMMIT_SHA}) to capyboop/paint..."
              git -C "${TAG_REPO_DIR}" tag -f "${TAG_NAME}" "${PUSHED_COMMIT_SHA}"
              git -C "${TAG_REPO_DIR}" push target "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            elif [ "${TAG_LS_RC}" -eq 0 ]; then
              echo "Tag ${TAG_NAME} already exists on capyboop/paint; skipping tag push."
            else
              echo "git ls-remote --tags target refs/tags/${TAG_NAME} failed with exit code ${TAG_LS_RC}." >&2
              exit "${TAG_LS_RC}"
            fi
          fi

      - name: Migrate open issues from capyboop/capy to capyboop/paint
        if: steps.check_secret.outputs.enabled == 'true' && inputs.migrate_issues == true
        env:
          CAPYBOOP_SYNC_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN }}
        run: |
          node - <<'NODE'
          const token = process.env.CAPYBOOP_SYNC_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'capyboop-publish',
          };
          const [srcResp, dstResp] = await Promise.all([
            fetch('https://api.github.com/repos/capyboop/capy/issues?state=open&per_page=100', { headers }),
            fetch('https://api.github.com/repos/capyboop/paint/issues?state=all&per_page=100', { headers }),
          ]);
          const srcIssues = (await srcResp.json()).filter((i) => !i.pull_request).sort((a, b) => a.number - b.number);
          const dstIssues = await dstResp.json();
          const existingTitles = new Set(Array.isArray(dstIssues) ? dstIssues.map((i) => i.title.trim()) : []);
          for (const issue of srcIssues) {
            const title = issue.title.trim();
            if (existingTitles.has(title)) {
              console.log(`Skipping already-present issue: ${title}`);
              continue;
            }
            const res = await fetch('https://api.github.com/repos/capyboop/paint/issues', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, body: issue.body || '' }),
            });
            const data = await res.json();
            if (!res.ok) {
              throw new Error(`Failed creating "${title}" (${res.status}): ${JSON.stringify(data)}`);
            }
            console.log(`Created #${data.number}: ${data.html_url}`);
          }
          NODE

      - name: Migrate sanitized public Epics (EPIC-2..EPIC-5) to capyboop/paint
        if: steps.check_secret.outputs.enabled == 'true' && inputs.migrate_public_epics == true
        env:
          CAPYBOOP_SYNC_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          import path from 'node:path';
          const { transformPersonaContent } = await import(
            path.resolve(process.cwd(), 'web/scripts/rebrand-persona.mjs')
          );
          const botHeaders = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'User-Agent': 'capyboop-publish',
          };
          const pubHeaders = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.CAPYBOOP_SYNC_TOKEN}`,
            'User-Agent': 'capyboop-publish',
          };
          const dstResp = await fetch('https://api.github.com/repos/capyboop/paint/issues?state=all&per_page=100', {
            headers: pubHeaders,
          });
          const dstIssues = await dstResp.json();
          const existingTitles = new Set(Array.isArray(dstIssues) ? dstIssues.map((i) => i.title.trim()) : []);

          const scrub = (text) =>
            transformPersonaContent(text || '')
              .replace(/pr-review-gate/gi, 'review-gate')
              .replace(/publish-capyboop/gi, 'publish-mirror')
              .replace(/rebrand-persona/gi, 'persona-export')
              .replace(/open-pr\.yml/gi, 'open-pr')
              .replace(/sync-beta-from-main/gi, 'sync-beta')
              .replace(/sync-agile-tracker/gi, 'sync-tracker')
              .replace(/CAPYBOOP_SYNC_TOKEN/gi, 'SYNC_TOKEN')
              .replace(/shthed/gi, 'capyboop');

          for (const num of [477, 478, 479, 480]) {
            const srcResp = await fetch(`https://api.github.com/repos/shthed/capy/issues/${num}`, {
              headers: botHeaders,
            });
            const src = await srcResp.json();
            if (!srcResp.ok || src.state !== 'open') {
              console.log(`Skipping shthed/capy #${num} (state=${src.state || srcResp.status})`);
              continue;
            }
            const cleanTitle = scrub(src.title).trim();
            const cleanBody = scrub(src.body || '').trim();
            if (/shthed/i.test(`${cleanTitle}\n${cleanBody}`)) {
              throw new Error(`Refusing to publish #${num}: source persona still detected.`);
            }
            if (!existingTitles.has(cleanTitle)) {
              const createResp = await fetch('https://api.github.com/repos/capyboop/paint/issues', {
                method: 'POST',
                headers: { ...pubHeaders, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: cleanTitle, body: cleanBody }),
              });
              const created = await createResp.json();
              if (!createResp.ok) {
                throw new Error(`Failed creating "${cleanTitle}" (${createResp.status}): ${JSON.stringify(created)}`);
              }
              console.log(`Migrated #${num} -> ${created.html_url}`);
            } else {
              console.log(`Already present on capyboop/paint: ${cleanTitle}`);
            }
            // Close on shthed/capy with plain text (NO cross-repo URL or #N to avoid timeline backlink)
            await fetch(`https://api.github.com/repos/shthed/capy/issues/${num}/comments`, {
              method: 'POST',
              headers: { ...botHeaders, 'Content-Type': 'application/json' },
              body: JSON.stringify({ body: 'Moved public roadmap tracking to the standalone capyboop/paint repository.' }),
            });
            await fetch(`https://api.github.com/repos/shthed/capy/issues/${num}`, {
              method: 'PATCH',
              headers: { ...botHeaders, 'Content-Type': 'application/json' },
              body: JSON.stringify({ state: 'closed' }),
            });
            console.log(`Closed shthed/capy #${num}`);
          }
          NODE
