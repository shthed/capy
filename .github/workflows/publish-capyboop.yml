name: Publish Clean Mirror to capyboop/paint

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reset_clean_root:
        description: 'Reset capyboop/paint main to a fresh clean-room history authored by capyboop'
        required: false
        default: false
        type: boolean
      replay_full_history:
        description: 'Replay entire shthed/capy main commit history as clean capyboop commits'
        required: false
        default: false
        type: boolean
      triage_issue_number:
        description: 'Optional capyboop/paint issue number to label/comment/update strictly as capyboop (skips mirror publish)'
        required: false
        default: ''
        type: string
      triage_labels:
        description: 'Optional comma-separated labels to apply to the target capyboop/paint issue'
        required: false
        default: ''
        type: string
      triage_comment:
        description: 'Optional sanitized public comment body to post as capyboop'
        required: false
        default: ''
        type: string
      triage_state:
        description: 'Optional state update for the target capyboop/paint issue (open or closed)'
        required: false
        default: ''
        type: string

concurrency:
  group: publish-capyboop-${{ inputs.triage_issue_number || 'mirror' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    name: Export & Push Clean capyboop Release
    if: github.repository == 'shthed/capy' && !(github.event_name == 'workflow_dispatch' && inputs.triage_issue_number != '')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check CAPYBOOP_SYNC_TOKEN configuration
        id: check_secret
        env:
          HAS_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### capyboop/paint Auto-Publish Skipped (Token Not Configured)"
              echo ""
              echo "Add fine-grained Personal Access Token secret \`CAPYBOOP_SYNC_TOKEN\` (scoped to \`capyboop/paint\` with **Contents: Read & write** and **Workflows: Read & write**) under \`shthed/capy\` **Settings -> Secrets and variables -> Actions -> Secrets** to publish every \`main\` merge automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout source repository
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag push targets origin/main
        id: check_ref
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${TRIGGER_REF}" == refs/tags/* ]]; then
            HEAD_SHA="$(git rev-parse HEAD)"
            MAIN_SHA="$(git rev-parse -q --verify refs/remotes/origin/main || true)"
            if [ -z "${MAIN_SHA}" ] || [ "${HEAD_SHA}" != "${MAIN_SHA}" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "Tag ${TRIGGER_REF} (${HEAD_SHA}) does not match origin/main (${MAIN_SHA:-missing}); skipping capyboop/paint publish."
              exit 0
            fi
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check_ref.outputs.should_publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Export clean-room capyboop workspace and verify zero leaks
        if: steps.check_ref.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          node web/scripts/rebrand-persona.mjs --stage-dir /tmp/capyboop-stage
          COMMIT_MSG="$(git log -1 --format=%s | node web/scripts/rebrand-persona.mjs --sanitize-message)"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('/tmp/capyboop-stage/web/package.json', 'utf8')).version")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer in staged web/package.json: ${VERSION}" >&2
            exit 1
          fi
          DELIM="EOF_COMMIT_MSG_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'commit_msg<<%s\n%s\n%s\n' "${DELIM}" "${COMMIT_MSG}" "${DELIM}"
            printf 'version=%s\n' "${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Commit as capyboop, push main, and sync release tag on capyboop/paint
        if: steps.check_ref.outputs.should_publish == 'true'
        env:
          CAPYBOOP_SYNC_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN }}
          RESET_CLEAN_ROOT: ${{ inputs.reset_clean_root == true }}
          REPLAY_FULL_HISTORY: ${{ inputs.replay_full_history == true }}
          SOURCE_REPO_DIR: ${{ github.workspace }}
          GIT_AUTHOR_NAME: capyboop
          GIT_AUTHOR_EMAIL: 354866242+capyboop@users.noreply.github.com
          GIT_COMMITTER_NAME: capyboop
          GIT_COMMITTER_EMAIL: 354866242+capyboop@users.noreply.github.com
        run: |
          set -euo pipefail
          cd /tmp/capyboop-stage

          ASKPASS_SCRIPT="$(mktemp)"
          LOG_FILE="$(mktemp)"
          cleanup() {
            rm -f "${ASKPASS_SCRIPT}" "${LOG_FILE}"
          }
          trap cleanup EXIT

          chmod 700 "${ASKPASS_SCRIPT}"
          cat <<'EOF' > "${ASKPASS_SCRIPT}"
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "${CAPYBOOP_SYNC_TOKEN}" ;;
          esac
          EOF
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          git init -b main
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config credential.helper ""
          git remote add target "https://x-access-token@github.com/capyboop/paint.git"
          git add -A

          NEEDS_CLEAN_RESET="false"
          if [ "${RESET_CLEAN_ROOT}" = "true" ] || [ "${REPLAY_FULL_HISTORY}" = "true" ]; then
            NEEDS_CLEAN_RESET="true"
          fi

          replay_full_clean_history() {
            node - "${SOURCE_REPO_DIR}" "${GIT_AUTHOR_NAME}" "${GIT_AUTHOR_EMAIL}" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const [srcRepo, authorName, authorEmail] = process.argv.slice(2);
          const { exportCleanPersonaStage, sanitizeCommitMessage } = await import(
            path.join(srcRepo, 'web/scripts/rebrand-persona.mjs')
          );

          const histSrc = '/tmp/capyboop-hist-src';
          const histStage = '/tmp/capyboop-hist-stage';
          const histDst = '/tmp/capyboop-hist-dst';
          fs.rmSync(histSrc, { recursive: true, force: true });
          fs.rmSync(histStage, { recursive: true, force: true });
          fs.rmSync(histDst, { recursive: true, force: true });

          execFileSync('git', ['-C', srcRepo, 'worktree', 'add', '--detach', histSrc, 'HEAD'], { stdio: 'ignore' });
          execFileSync('git', ['init', '-b', 'main', histDst], { stdio: 'ignore' });
          execFileSync('git', ['-C', histDst, 'config', 'user.name', authorName], { stdio: 'ignore' });
          execFileSync('git', ['-C', histDst, 'config', 'user.email', authorEmail], { stdio: 'ignore' });

          const commits = execFileSync('git', ['-C', srcRepo, 'rev-list', '--topo-order', '--reverse', 'HEAD'], {
            encoding: 'utf8',
          })
            .trim()
            .split('\n')
            .filter(Boolean);

          const headSha = commits[commits.length - 1];
          const cleanMap = new Map();
          let lastCleanSha = '';

          for (const origSha of commits) {
            const meta = execFileSync(
              'git',
              ['-C', srcRepo, 'show', '-s', '--format=%P%x1f%aI%x1f%cI%x1f%B', origSha],
              { encoding: 'utf8' }
            );
            const [parentsStr, authorDate, committerDate, rawMsg] = meta.split('\x1f');
            const origParents = parentsStr ? parentsStr.trim().split(/\s+/).filter(Boolean) : [];
            const cleanParents = origParents.map((p) => cleanMap.get(p)).filter(Boolean);

            execFileSync('git', ['-C', histSrc, 'checkout', '-f', '--detach', origSha], { stdio: 'ignore' });
            fs.rmSync(histStage, { recursive: true, force: true });
            exportCleanPersonaStage({
              repoRoot: histSrc,
              stageDir: histStage,
              historicalScrub: origSha !== headSha,
            });

            for (const entry of fs.readdirSync(histDst)) {
              if (entry === '.git') continue;
              fs.rmSync(path.join(histDst, entry), { recursive: true, force: true });
            }
            for (const entry of fs.readdirSync(histStage)) {
              fs.cpSync(path.join(histStage, entry), path.join(histDst, entry), { recursive: true });
            }

            execFileSync('git', ['-C', histDst, 'add', '-A'], { stdio: 'ignore' });
            const treeSha = execFileSync('git', ['-C', histDst, 'write-tree'], { encoding: 'utf8' }).trim();
            const cleanMsg =
              sanitizeCommitMessage((rawMsg || '').trim(), {
                fallback: `Historical commit ${origSha.slice(0, 7)}`,
              }) || `Commit ${origSha.slice(0, 7)}`;

            const commitArgs = ['-C', histDst, 'commit-tree', treeSha];
            for (const cp of cleanParents) {
              commitArgs.push('-p', cp);
            }
            commitArgs.push('-m', cleanMsg);

            const cleanSha = execFileSync('git', commitArgs, {
              encoding: 'utf8',
              env: {
                ...process.env,
                GIT_AUTHOR_NAME: authorName,
                GIT_AUTHOR_EMAIL: authorEmail,
                GIT_COMMITTER_NAME: authorName,
                GIT_COMMITTER_EMAIL: authorEmail,
                GIT_AUTHOR_DATE: authorDate.trim(),
                GIT_COMMITTER_DATE: committerDate.trim(),
              },
            }).trim();
            cleanMap.set(origSha, cleanSha);
            lastCleanSha = cleanSha;
          }

          execFileSync('git', ['-C', histDst, 'update-ref', 'refs/heads/main', lastCleanSha], { stdio: 'ignore' });
          execFileSync('git', ['-C', srcRepo, 'worktree', 'remove', '--force', histSrc], { stdio: 'ignore' });
          process.stdout.write(`${lastCleanSha}\n`);
          NODE
          }

          verify_clean_history_repo() {
            local repo_dir="$1"
            local verify_log_file
            verify_log_file="$(mktemp)"
            trap 'rm -f "${verify_log_file}"' RETURN

            git -C "${repo_dir}" log --all --format="%an %ae %cn %ce %B%x00" > "${verify_log_file}"
            node "${SOURCE_REPO_DIR}/web/scripts/rebrand-persona.mjs" --verify-log "${verify_log_file}"

            local legacy_hits
            legacy_hits="$(git -C "${repo_dir}" log --all --oneline -- '.github/copilot-instructions.md' 'capy.prompt.yml' 'CLAUDE.md' 'GEMINI.md' 'AGENTS.md' 'CAPYBOOP.md' 'docs/ai' 'web/scripts/rebrand-persona.mjs' '.github/workflows/publish-capyboop.yml')"
            if [ -n "${legacy_hits}" ]; then
              echo "Legacy dev-only file leaked in replayed history:" >&2
              echo "${legacy_hits}" >&2
              exit 1
            fi

            local token
            for token in \
              "Antigravity" \
              "AGENTS.md" \
              "PR Readiness" \
              "shthed" \
              "Codex" \
              "Claude" \
              "Gemini 2" \
              "Gemini 3" \
              "CAPYBOOP.md" \
              "WHITEBOARD.md" \
              "conversation://" \
              "MAJOR_CAPABILITY_SERVER_SIDE_GEMINI_API" \
              "invoke_subagent"; do
              local blob_hits
              blob_hits="$(git -C "${repo_dir}" log --all -i -S "${token}" --oneline)"
              if [ -n "${blob_hits}" ]; then
                echo "Forbidden token '${token}' leaked in replayed historical blobs:" >&2
                echo "${blob_hits}" >&2
                exit 1
              fi
            done
          }

          PUSHED_COMMIT_SHA=""
          MAIN_LS_RC=0
          git ls-remote --exit-code --heads target main >/dev/null || MAIN_LS_RC=$?
          if [ "${MAIN_LS_RC}" -eq 0 ]; then
            git fetch target main
            git log FETCH_HEAD --format="%an %ae %cn %ce %B%x00" > "${LOG_FILE}"
            VERIFY_LOG_RC=0
            node "${SOURCE_REPO_DIR}/web/scripts/rebrand-persona.mjs" --verify-log "${LOG_FILE}" || VERIFY_LOG_RC=$?
            if [ "${VERIFY_LOG_RC}" -eq 2 ]; then
              NEEDS_CLEAN_RESET="true"
            elif [ "${VERIFY_LOG_RC}" -ne 0 ]; then
              echo "Failed to scan FETCH_HEAD commit history (verify-log exit ${VERIFY_LOG_RC})." >&2
              exit "${VERIFY_LOG_RC}"
            fi

            if [ "${NEEDS_CLEAN_RESET}" = "true" ]; then
              echo "Replaying full clean-room commit history authored solely by capyboop..."
              PUSHED_COMMIT_SHA="$(replay_full_clean_history)"
              verify_clean_history_repo /tmp/capyboop-hist-dst
              git -C /tmp/capyboop-hist-dst remote add target "https://x-access-token@github.com/capyboop/paint.git"
              git -C /tmp/capyboop-hist-dst config credential.helper ""
              git -C /tmp/capyboop-hist-dst push --force target "${PUSHED_COMMIT_SHA}:refs/heads/main"
            else
              # shthed/capy main is the canonical tree source; external PRs merged on capyboop/paint
              # must be back-ported into shthed/capy (beta -> main) before pushing to main.
              TREE_SHA="$(git write-tree)"
              REMOTE_TREE_SHA="$(git rev-parse FETCH_HEAD^{tree})"
              if [ "${TREE_SHA}" = "${REMOTE_TREE_SHA}" ]; then
                echo "capyboop/paint main already matches clean tree (${TREE_SHA})."
                PUSHED_COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
              else
                PARENT_SHA="$(git rev-parse FETCH_HEAD)"
                NEW_COMMIT="$(git commit-tree "${TREE_SHA}" -p "${PARENT_SHA}" -m "${commit_msg}")"
                PUSHED_COMMIT_SHA="${NEW_COMMIT}"
                git push target "${PUSHED_COMMIT_SHA}:refs/heads/main"
              fi
            fi
          elif [ "${MAIN_LS_RC}" -eq 2 ]; then
            echo "Target repository has no main branch yet; replaying full clean-room commit history..."
            PUSHED_COMMIT_SHA="$(replay_full_clean_history)"
            verify_clean_history_repo /tmp/capyboop-hist-dst
            git -C /tmp/capyboop-hist-dst remote add target "https://x-access-token@github.com/capyboop/paint.git"
            git -C /tmp/capyboop-hist-dst config credential.helper ""
            git -C /tmp/capyboop-hist-dst push --force target "${PUSHED_COMMIT_SHA}:refs/heads/main"
          else
            echo "git ls-remote --heads target main failed with exit code ${MAIN_LS_RC}." >&2
            exit "${MAIN_LS_RC}"
          fi

          TAG_NAME="v${version}"
          TAG_REPO_DIR="/tmp/capyboop-stage"
          if [ -d /tmp/capyboop-hist-dst/.git ]; then
            TAG_REPO_DIR="/tmp/capyboop-hist-dst"
          fi
          TAG_COMMIT="$(git -C "${SOURCE_REPO_DIR}" rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}" || true)"
          HEAD_COMMIT="$(git -C "${SOURCE_REPO_DIR}" rev-parse HEAD)"
          if [ -z "${TAG_COMMIT}" ] || [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "Tag ${TAG_NAME} does not point to HEAD (${HEAD_COMMIT}) on source repository; skipping tag push to capyboop/paint."
          elif [ "${NEEDS_CLEAN_RESET}" = "true" ]; then
            echo "Force-syncing release tag ${TAG_NAME} (${PUSHED_COMMIT_SHA}) onto clean root..."
            git -C "${TAG_REPO_DIR}" tag -f "${TAG_NAME}" "${PUSHED_COMMIT_SHA}"
            git -C "${TAG_REPO_DIR}" push --force target "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          else
            TAG_LS_RC=0
            git ls-remote --exit-code --tags target "refs/tags/${TAG_NAME}" >/dev/null || TAG_LS_RC=$?
            if [ "${TAG_LS_RC}" -eq 2 ]; then
              echo "Pushing release tag ${TAG_NAME} (${PUSHED_COMMIT_SHA}) to capyboop/paint..."
              git -C "${TAG_REPO_DIR}" tag -f "${TAG_NAME}" "${PUSHED_COMMIT_SHA}"
              git -C "${TAG_REPO_DIR}" push target "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            elif [ "${TAG_LS_RC}" -eq 0 ]; then
              echo "Tag ${TAG_NAME} already exists on capyboop/paint; skipping tag push."
            else
              echo "git ls-remote --tags target refs/tags/${TAG_NAME} failed with exit code ${TAG_LS_RC}." >&2
              exit "${TAG_LS_RC}"
            fi
          fi

          if [ "${NEEDS_CLEAN_RESET}" = "true" ]; then
            echo "Pruning orphaned remote tags not reachable from clean main (${PUSHED_COMMIT_SHA})..."
            REMOTE_TAGS="$(git -C "${TAG_REPO_DIR}" ls-remote --tags target)"
            declare -A tag_sha=()
            while read -r remote_sha remote_ref; do
              [ -z "${remote_ref}" ] && continue
              case "${remote_ref}" in
                *'^{}')
                  tag_name="${remote_ref#refs/tags/}"
                  tag_name="${tag_name%\^\{\}}"
                  tag_sha["${tag_name}"]="${remote_sha}"
                  ;;
                refs/tags/*)
                  tag_name="${remote_ref#refs/tags/}"
                  if [ -z "${tag_sha["${tag_name}"]+x}" ]; then
                    tag_sha["${tag_name}"]="${remote_sha}"
                  fi
                  ;;
              esac
            done <<< "${REMOTE_TAGS}"
            for remote_tag in "${!tag_sha[@]}"; do
              remote_sha="${tag_sha["${remote_tag}"]}"
              if ! git -C "${TAG_REPO_DIR}" merge-base --is-ancestor "${remote_sha}" "${PUSHED_COMMIT_SHA}" 2>/dev/null; then
                echo "Deleting orphaned remote tag ${remote_tag} (${remote_sha}) on capyboop/paint..."
                git -C "${TAG_REPO_DIR}" push target ":refs/tags/${remote_tag}"
              fi
            done
          fi

  triage-public-issue:
    name: Triage capyboop/paint Issue as capyboop
    if: github.repository == 'shthed/capy' && github.event_name == 'workflow_dispatch' && inputs.triage_issue_number != ''
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository (for persona leak guard)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply sanitized labels, comment, or state on capyboop/paint as capyboop
        env:
          CAPYBOOP_SYNC_TOKEN: ${{ secrets.CAPYBOOP_SYNC_TOKEN }}
          TRIAGE_ISSUE_NUMBER: ${{ inputs.triage_issue_number }}
          TRIAGE_LABELS: ${{ inputs.triage_labels }}
          TRIAGE_COMMENT: ${{ inputs.triage_comment }}
          TRIAGE_STATE: ${{ inputs.triage_state }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const { FORBIDDEN_PERSONA_REGEX } = await import(
            path.resolve(process.cwd(), 'web/scripts/rebrand-persona.mjs')
          );

          const token = String(process.env.CAPYBOOP_SYNC_TOKEN || '').trim();
          if (!token) {
            throw new Error('CAPYBOOP_SYNC_TOKEN secret is not configured.');
          }

          const issueNum = String(process.env.TRIAGE_ISSUE_NUMBER || '').trim();
          if (!/^[1-9]\d*$/.test(issueNum)) {
            throw new Error(`Invalid triage_issue_number: "${issueNum}" (expected positive integer).`);
          }

          const labels = String(process.env.TRIAGE_LABELS || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          const comment = String(process.env.TRIAGE_COMMENT || '').trim();
          const state = String(process.env.TRIAGE_STATE || '').trim().toLowerCase();

          if (state && state !== 'open' && state !== 'closed') {
            throw new Error(`Invalid triage_state: "${state}" (expected "open" or "closed").`);
          }
          if (labels.length === 0 && !comment && !state) {
            throw new Error('At least one of triage_labels, triage_comment, or triage_state is required.');
          }

          const combinedPayload = `${labels.join(' ')}\n${comment}`;
          const leakMatch = combinedPayload.match(FORBIDDEN_PERSONA_REGEX);
          if (leakMatch) {
            throw new Error(`Refusing public write: forbidden persona/dev token matched ("${leakMatch[0]}").`);
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
            'User-Agent': 'capyboop-issue-triage',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          const baseUrl = `https://api.github.com/repos/capyboop/paint/issues/${issueNum}`;
          const summaryLines = [`### Public Issue Triage (capyboop/paint issue ${issueNum})`, ''];

          if (labels.length > 0) {
            const labelRes = await fetch(`${baseUrl}/labels`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ labels }),
            });
            if (!labelRes.ok) {
              const errText = await labelRes.text();
              throw new Error(`Failed to add labels (${labelRes.status}): ${errText.slice(0, 300)}`);
            }
            summaryLines.push(`- **Labels added**: ${labels.map((l) => `\`${l}\``).join(', ')}`);
          }

          if (comment) {
            const commentRes = await fetch(`${baseUrl}/comments`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ body: comment }),
            });
            if (!commentRes.ok) {
              const errText = await commentRes.text();
              throw new Error(`Failed to post comment (${commentRes.status}): ${errText.slice(0, 300)}`);
            }
            const created = await commentRes.json();
            summaryLines.push(`- **Comment posted** by \`${created?.user?.login || 'capyboop'}\`: ${created?.html_url || baseUrl}`);
          }

          if (state) {
            const stateRes = await fetch(baseUrl, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ state }),
            });
            if (!stateRes.ok) {
              const errText = await stateRes.text();
              throw new Error(`Failed to update state (${stateRes.status}): ${errText.slice(0, 300)}`);
            }
            summaryLines.push(`- **State updated**: \`${state}\``);
          }

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (summaryPath) {
            fs.appendFileSync(summaryPath, `${summaryLines.join('\n')}\n`);
          }
          console.log(summaryLines.join('\n'));
          NODE

