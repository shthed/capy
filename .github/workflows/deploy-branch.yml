name: Deploy GitHub Pages previews

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to deploy (defaults to the event branch)
        required: false
        default: ''
      allow_without_pr:
        description: Allow deployment when no open PR exists for the branch
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Unit Tests & APK Build
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || (github.event.pull_request.head.ref || github.ref) }}

      - name: Download built Web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run unit tests (app & app1) and build Debug APK (app/)
        run: ./gradlew app:testDebugUnitTest app:assembleDebug app1:testDebugUnitTest --build-cache

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: capy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  web:
    name: Web & Web1 Build + Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || (github.event.pull_request.head.ref || github.ref) }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web1/package-lock.json

      - name: Build & typecheck updated web app (web/)
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install Legacy Web1 dependencies (web1/)
        working-directory: web1
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web1/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: web1
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Run Playwright smoke tests (Web & Web1)
        working-directory: web1
        run: |
          cp -r ../web/dist web-dist-test
          npm test --silent
          rm -rf web-dist-test

      - name: Upload built Web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages & APK
    needs: [android, web]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.target.outputs.preview_url }}
    env:
      BASE_PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Determine deployment target
        id: target
        uses: actions/github-script@v9
        with:
          script: |
            const inputs = context.payload?.inputs || {};
            const branchInput = inputs.target_branch || '';
            const allowWithoutPrInput = inputs.allow_without_pr;
            const prFromPayload = context.payload?.pull_request?.number;
            const branchFromPayload = context.payload?.pull_request?.head?.ref;
            const branch = branchInput || branchFromPayload || context.ref.replace('refs/heads/', '');
            const allowWithoutPr = String(allowWithoutPrInput).toLowerCase() === 'true';

            if (!branch) {
              core.setFailed('Branch name is required');
              return;
            }

            const basePreview = process.env.BASE_PREVIEW_URL;
            const safeBranch = branch.replace(/[^a-zA-Z0-9._-]/g, '-');

            let prNumber = prFromPayload;
            if (!prNumber) {
              try {
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${context.repo.owner}:${branch}`,
                  state: 'open',
                  per_page: 1,
                });

                prNumber = prs[0]?.number;
              } catch (error) {
                core.warning(`Failed to look up PR for ${branch}: ${error.message}`);
              }
            }

            const targetDir = branch === 'main'
              ? '.'
              : prNumber
                ? `pull/${prNumber}`
                : `pull/${safeBranch}`;

            const previewUrl = targetDir === '.'
              ? `${basePreview}/`
              : `${basePreview}/${targetDir}/`;

            const branchPreviewUrl = targetDir === '.'
              ? `${basePreview}/`
              : `${basePreview}/pull/${safeBranch}/`;

            const shouldSkip = branch !== 'main' && !prNumber && !allowWithoutPr;

            const summaryLines = [
              `Branch: ${branch}`,
              prNumber ? `PR: #${prNumber}` : 'PR: none found',
              `Target directory: ${targetDir}`,
              `Preview URL (Web): ${previewUrl}`,
              `Preview URL (Branch Web): ${branchPreviewUrl}`,
              `Preview URL (Web1): ${previewUrl}web1/`,
              `Android APK URL: ${previewUrl}capy.apk`,
            ];

            if (shouldSkip) {
              summaryLines.push('Deployment skipped: branch has no open PR (override with allow_without_pr).');
            }

            core.setOutput('branch', branch);
            core.setOutput('safe_branch', safeBranch);
            core.setOutput('pr', prNumber ? String(prNumber) : '');
            core.setOutput('target_dir', targetDir);
            core.setOutput('preview_url', previewUrl);
            core.setOutput('branch_preview_url', branchPreviewUrl);
            core.setOutput('skip', shouldSkip ? 'true' : 'false');

            core.summary.addRaw(summaryLines.join('\n')).write();

      - name: Check out source
        if: steps.target.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || (github.event.pull_request.head.ref || github.ref) }}

      - name: Use Node.js 22
        if: steps.target.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download built Web bundle
        if: steps.target.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Download built Android APK
        if: steps.target.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: capy-debug-apk
          path: apk-artifact

      - name: Retrieve existing gh-pages content
        if: steps.target.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf pages

          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          else
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
            rm -rf pages/*
          fi

      - name: Prune closed PR previews from gh-pages
        if: steps.target.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node ./web1/scripts/cleanup-gh-pages-previews.mjs --pages-dir pages

      - name: Prepare site content
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
          SAFE_BRANCH: ${{ steps.target.outputs.safe_branch }}
        run: |
          set -euo pipefail

          DEST_DIR="pages/${TARGET_DIR}"

          if [ "${TARGET_DIR}" = "." ]; then
            DEST_DIR="pages"
            mkdir -p "${DEST_DIR}"
            rsync -av --delete \
              --exclude '.git/' \
              --exclude 'pull/' \
              --exclude 'web1/' \
              --exclude 'README/' \
              web/dist/ "${DEST_DIR}/"
          else
            rm -rf "${DEST_DIR}"
            mkdir -p "${DEST_DIR}"
            rsync -av --delete \
              web/dist/ "${DEST_DIR}/"
          fi

          cp apk-artifact/app-debug.apk "${DEST_DIR}/capy.apk"

          mkdir -p "${DEST_DIR}/web1"
          rsync -av --delete \
            --exclude 'node_modules/' \
            --exclude 'docs/' \
            --exclude 'notes/' \
            --exclude 'scripts/' \
            --exclude 'tests/' \
            --exclude 'artifacts/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' \
            --exclude 'server.js' \
            web1/ "${DEST_DIR}/web1/"

          # Also mirror to pages/pull/${SAFE_BRANCH} if different from TARGET_DIR so both branch and PR URLs resolve
          if [ -n "${SAFE_BRANCH:-}" ] && [ "${TARGET_DIR}" != "pull/${SAFE_BRANCH}" ] && [ "${TARGET_DIR}" != "." ]; then
            rm -rf "pages/pull/${SAFE_BRANCH}"
            mkdir -p "pages/pull"
            cp -r "${DEST_DIR}" "pages/pull/${SAFE_BRANCH}"
          fi

      - name: Sync gh-pages branch (squashed history) and remove .git before artifact upload
        if: steps.target.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set -euo pipefail
          if [ -d pages/.git ]; then
            cd pages
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add -A
            if ! git diff --cached --quiet || git cat-file -p HEAD | grep -q '^parent '; then
              git checkout --orphan gh-pages-squashed
              git add -A
              git commit -m "Deploy ${TARGET_DIR}"
              git branch -M gh-pages
              git push --force origin gh-pages || echo "Warning: gh-pages push skipped"
            fi
            cd ..
            rm -rf pages/.git
          fi

      - name: Capture deployment directory listing
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set -euo pipefail

          LIST_PATH="pages/${TARGET_DIR}"
          echo "Listing contents for ${LIST_PATH} and ${LIST_PATH}/web1" > deployment-directory-listing.txt
          ls -lh "${LIST_PATH}" "${LIST_PATH}/web1" | tee -a deployment-directory-listing.txt

      - name: Upload Pages artifact
        if: steps.target.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        if: steps.target.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Comment PR with preview & APK links
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.pr != ''
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.target.outputs.pr }}');
            const previewUrl = '${{ steps.target.outputs.preview_url }}';
            const branchPreviewUrl = '${{ steps.target.outputs.branch_preview_url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- capy-pages-preview -->';
            const body = [
              marker,
              '### 🚀 Capy Preview & APK Deployed',
              `- **Workflow Run**: [${context.runId}](${runUrl})`,
              `- **PR Preview (\`/\`)**: ${previewUrl}`,
              `- **Branch Preview (\`/\`)**: ${branchPreviewUrl}`,
              `- **Legacy Web1 App (\`/web1/\`)**: ${previewUrl}web1/`,
              `- **Android Debug APK**: [${previewUrl}capy.apk](${previewUrl}capy.apk)`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Output preview link
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          {
            echo "Preview (Web): ${{ steps.target.outputs.preview_url }}"
            if [ -n "${{ steps.target.outputs.safe_branch }}" ] && [ "${{ steps.target.outputs.target_dir }}" != "pull/${{ steps.target.outputs.safe_branch }}" ] && [ "${{ steps.target.outputs.target_dir }}" != "." ]; then
              echo "Branch Preview (Web): ${{ env.BASE_PREVIEW_URL }}/pull/${{ steps.target.outputs.safe_branch }}/"
            fi
            echo "Preview (Web1): ${{ steps.target.outputs.preview_url }}web1/"
            echo "Android APK: ${{ steps.target.outputs.preview_url }}capy.apk"
            echo ""
            echo "Deployment directory listing (pages/${TARGET_DIR}):"
            echo '```'
            cat deployment-directory-listing.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
