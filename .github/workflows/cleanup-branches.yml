name: Cleanup stale codex branches

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  pull-requests: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run branch cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_CLEANUP_PREFIXES: ''
        run: |
          set -euo pipefail

          node ./web1/scripts/cleanup-branches.mjs | tee cleanup-branches.log

          {
            echo "## Branch cleanup output";
            echo '```';
            cat cleanup-branches.log;
            echo '```';

            processed=$(grep '^-' cleanup-branches.log || true)
            if [ -n "$processed" ]; then
              echo
              echo "## Processed branches"
              echo '```'
              echo "$processed"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh remote branch list
        run: git fetch origin --prune

      - name: Prune orphaned gh-pages preview directories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          node ./web1/scripts/cleanup-gh-pages-previews.mjs --pages-dir ./gh-pages

      - name: Commit and push gh-pages updates (squashed history)
        id: sync_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -A
          if git diff --cached --quiet && ! (git cat-file -p HEAD | grep -q '^parent '); then
            echo "No gh-pages changes to push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout --orphan gh-pages-squashed
          git add -A
          git commit -m "Remove orphaned preview directories"
          git branch -M gh-pages
          git push --force origin gh-pages
          cd ..
          rm -rf gh-pages/.git
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.sync_pages.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        if: steps.sync_pages.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
