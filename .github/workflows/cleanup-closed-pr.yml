name: Cleanup closed PR previews

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  pull-requests: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check gh-pages and GitHub Pages availability
        id: pages_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAGES: ${{ github.event.repository.has_pages == true }}
        run: |
          set -euo pipefail
          if [ "${HAS_PAGES}" = "true" ] && git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "can_cleanup_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_cleanup_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages branch
        if: steps.pages_check.outputs.can_cleanup_pages == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Delete branch from origin
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          BRANCH_NAME="${HEAD_REF}"

          if [ -z "${BRANCH_NAME}" ]; then
            echo "No branch provided; skipping delete."
            exit 0
          fi

          if [ "${BRANCH_NAME}" = "${DEFAULT_BRANCH}" ] || [ "${BRANCH_NAME}" = "beta" ] || [ "${BRANCH_NAME}" = "gh-pages" ]; then
            echo "Skipping deletion of protected branch ${BRANCH_NAME}."
            exit 0
          fi

          git push origin --delete "${BRANCH_NAME}" || echo "Branch deletion skipped (already removed or protected)."

      - name: Run gh-pages preview cleanup
        if: steps.pages_check.outputs.can_cleanup_pages == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          node ./.github/scripts/cleanup-gh-pages-previews.mjs \
            --pages-dir ./gh-pages \
            --target-pr "${TARGET_PR}" \
            --ignore-recency

          if [ -n "$(git -C ./gh-pages status --porcelain)" ] || [ ! -f ./gh-pages/alpha/manifest.json ]; then
            node ./.github/scripts/generate-pr-manifest.mjs --pages-dir ./gh-pages
          else
            echo "No gh-pages preview changes detected; skipping manifest regeneration."
          fi

      - name: Commit and push gh-pages updates (squashed history)
        id: sync_pages
        if: steps.pages_check.outputs.can_cleanup_pages == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout --orphan gh-pages-squashed
          git add -A
          git commit -m "Cleanup preview for PR #${PR_NUMBER}"
          git branch -M gh-pages
          git push --force origin gh-pages
          cd ..
          rm -rf gh-pages/.git
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.pages_check.outputs.can_cleanup_pages == 'true' && steps.sync_pages.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact index propagation
        if: steps.pages_check.outputs.can_cleanup_pages == 'true' && steps.sync_pages.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  per_page: 100,
                });
                const found = (data.artifacts || []).find(
                  (a) => a.name === artifactName && !a.expired
                );
                if (found) {
                  core.info(`Pages artifact "${artifactName}" indexed (id=${found.id}) on attempt ${attempt}.`);
                  return;
                }
                core.info(`Waiting for Pages artifact "${artifactName}" (attempt ${attempt}/12)...`);
              } catch (err) {
                core.warning(`Failed to list workflow run artifacts on attempt ${attempt}/12: ${err?.message || err}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            core.warning(`Pages artifact "${artifactName}" not yet listed after 24s; proceeding to deploy-pages.`);

      - name: Deploy to GitHub Pages
        if: steps.pages_check.outputs.can_cleanup_pages == 'true' && steps.sync_pages.outputs.has_changes == 'true'
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying GitHub Pages deploy
        if: steps.pages_check.outputs.can_cleanup_pages == 'true' && steps.sync_pages.outputs.has_changes == 'true' && steps.deployment_primary.outcome != 'success'
        run: sleep 10

      - name: Retry Deploy to GitHub Pages
        if: steps.pages_check.outputs.can_cleanup_pages == 'true' && steps.sync_pages.outputs.has_changes == 'true' && steps.deployment_primary.outcome != 'success'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
