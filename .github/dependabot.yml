version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "beta"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "web"
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "beta"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "android"
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "beta"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
