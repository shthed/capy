name: Feature or Tutorial Improvement
description: Suggest a new feature, UI polish, accessibility improvement, or tutorial update
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tutorial & Tooltips
        - Gameplay & Gestures
        - Settings & Customization
        - Puzzle Generation & Photo Import
        - Accounts & Cloud Sync
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem or gap does this address?
      description: Describe what feels missing or confusing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: How would you like it to work?
    validations:
      required: true
