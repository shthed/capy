<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capy Paint — Page Not Found</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #6e5d4f;
      --accent: #d97706;
      --accent-hover: #b45309;
      --border: #e7dfd5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181411;
        --card: #241e19;
        --text: #f5efe8;
        --muted: #b5a697;
        --accent: #f59e0b;
        --accent-hover: #d97706;
        --border: #3a3027;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    a.btn {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }
    a.btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    a.btn.primary:hover {
      background: var(--accent-hover);
    }
    a.btn:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card" id="content">
    <h1>404 — Page Not Found</h1>
    <p id="message">This Capy Paint preview or page could not be found.</p>
    <div class="links">
      <a class="btn primary" href="/capy/">Go to Capy Paint (Production)</a>
      <a class="btn" href="/capy/beta/">Go to Beta Channel</a>
      <a class="btn" id="pr-link" href="/capy/alpha/">View Open PR Previews</a>
    </div>
  </main>
  <script>
    (function () {
      var pathname = window.location.pathname || '';
      var match = pathname.match(/^\/capy\/(alpha|PR|pull)(?:\/+([^/]+)(?:\/.*)?|\/+)?$/i);
      var prefix = match ? match[1].toLowerCase() : '';
      var id = match && match[2] ? match[2].trim() : '';
      if (match && (id || prefix !== 'alpha')) {
        var target = id
          ? '/capy/alpha/?missing=' + encodeURIComponent(id)
          : '/capy/alpha/';
        var msg = document.getElementById('message');
        var prLink = document.getElementById('pr-link');
        if (msg) {
          msg.textContent = id
            ? 'PR #' + id + ' preview is no longer deployed. Redirecting to Open PR Previews...'
            : 'Redirecting to Open PR Previews...';
        }
        if (prLink) {
          prLink.setAttribute('href', target);
        }
        window.location.replace(target);
      }
    })();
  </script>
</body>
</html>
